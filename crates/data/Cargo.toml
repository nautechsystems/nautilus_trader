[package]
name = "nautilus-data"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Core data handling machinery for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_data"
crate-type = ["rlib"]

[features]
default = []
streaming = ["nautilus-persistence"]
high-precision = [
  "nautilus-model/high-precision",
  "nautilus-serialization/high-precision",
]
extension-module = [
  "nautilus-core/extension-module",
  "nautilus-model/extension-module",
  "pyo3/extension-module",
]
python = [
  "nautilus-core/python",
  "nautilus-model/python",
  "nautilus-persistence?/python",
  "pyo3",
  "pyo3-stub-gen",
]
defi = [
  "nautilus-common/defi",
  "nautilus-model/defi",
  "nautilus-persistence?/defi",
  "alloy-primitives",
]

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["defi", "high-precision", "streaming"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-common = { workspace = true }
nautilus-core = { workspace = true }
nautilus-model = { workspace = true, features = ["test-support"] }
nautilus-persistence = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ustr = { workspace = true }

alloy-primitives = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nautilus-serialization = { workspace = true, features = ["arrow"] }

criterion = { workspace = true }
parking_lot = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }

# Run with `cargo bench -p nautilus-data --bench engine`
[[bench]]
name = "engine"
harness = false

# Run with `cargo bench -p nautilus-data --bench aggregation`
[[bench]]
name = "aggregation"
harness = false
