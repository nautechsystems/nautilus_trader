[package]
name = "nautilus-kalshi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Kalshi integration adapter for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_kalshi"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
examples = ["nautilus-live/node", "nautilus-trading/examples"]
fuzz = ["nautilus-live/fuzz"]
extension-module = [
  "nautilus-common/extension-module",
  "nautilus-model/extension-module",
  "nautilus-network/extension-module",
  "pyo3/extension-module",
  "python",
]
python = [
  "dep:nautilus-system",
  "nautilus-common/python",
  "nautilus-core/python",
  "nautilus-model/python",
  "nautilus-network/python",
  "nautilus-system/python",
  "pyo3",
  "pyo3-stub-gen",
]
high-precision = ["nautilus-model/high-precision"]
simulation = [
  "dep:madsim",
  "nautilus-common/simulation",
  "nautilus-core/simulation",
  "nautilus-live/simulation",
  "nautilus-network/simulation",
]

[package.metadata]
cargo-fuzz = true

[package.metadata.cargo-machete]
ignored = [
  "ahash", # Used by the shared book stress tests the harness includes by path
  "axum", # Used by the shared book stress tests the harness includes by path
  "parking_lot", # Used by the shared book stress tests the harness includes by path
  "rust_decimal_macros", # Used by the shared book stress tests the harness includes by path
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-common = { workspace = true, features = ["live"] }
nautilus-core = { workspace = true }
nautilus-live = { workspace = true }
nautilus-model = { workspace = true }
nautilus-network = { workspace = true, features = ["transport-sockudo"] }
nautilus-system = { workspace = true, optional = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
bon = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
ustr = { workspace = true }
zeroize = { workspace = true }

madsim = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nautilus-data = { workspace = true }
nautilus-execution = { workspace = true }
nautilus-live = { workspace = true, features = ["node", "test-support"] }
nautilus-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }
nautilus-trading = { workspace = true }

ahash = { workspace = true }
axum = { workspace = true }
criterion = { workspace = true }
parking_lot = { workspace = true }
rstest = { workspace = true }
rust_decimal_macros = { workspace = true }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }

[[bench]]
name = "data"
harness = false

[[bench]]
name = "exec"
harness = false

[[bench]]
name = "alloc"
harness = false

[[bench]]
name = "micros"
harness = false

[[bin]]
name = "fuzz-ws-decode"
path = "fuzz/fuzz_targets/fuzz_ws_decode.rs"
required-features = ["fuzz"]
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-fixed-point"
path = "fuzz/fuzz_targets/fuzz_fixed_point.rs"
required-features = ["fuzz"]
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-book"
path = "fuzz/fuzz_targets/fuzz_book.rs"
required-features = ["fuzz"]
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-order-wire"
path = "fuzz/fuzz_targets/fuzz_order_wire.rs"
required-features = ["fuzz"]
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-exec-report"
path = "fuzz/fuzz_targets/fuzz_exec_report.rs"
required-features = ["fuzz"]
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-sid-sequence"
path = "fuzz/fuzz_targets/fuzz_sid_sequence.rs"
required-features = ["fuzz"]
test = false
doc = false
bench = false

[[example]]
name = "kalshi-data-tester"
path = "examples/node_data_tester.rs"
doc = false

[[example]]
name = "kalshi-exec-tester"
path = "examples/node_exec_tester.rs"
doc = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "kalshi-book-stress"
path = "tests/stress/book_stress.rs"
harness = false
test = false
required-features = ["examples"]
