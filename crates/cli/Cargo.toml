[package]
name = "nautilus-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
default = []
high-precision = ["nautilus-persistence/high-precision"]

[package.metadata.docs.rs]
features = ["high-precision"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-common = { workspace = true }
nautilus-infrastructure = { workspace = true, features = ["postgres"] }
nautilus-model = { workspace = true }
nautilus-persistence = { workspace = true, features = ["cloud"] }

anyhow = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
log = { workspace = true }
mimalloc = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "nautilus"
path = "src/bin/cli.rs"
doc = false
test = false
