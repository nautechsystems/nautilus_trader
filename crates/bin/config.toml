[grid_mm]
execution_environment = "live" # backtest, live, sandbox
exchange = "bybit"
trader_id = "TESTER-001"
instrument_id = "OPUSDT-LINEAR.BYBIT"
max_position = "30"
trade_size = "10"
num_levels = 1
grid_step_bps = 12
skew_factor = 0.0
requote_threshold_bps = 3
expire_time_secs = 5
on_cancel_resubmit = false
path = "/var/lib/nautilus-trader/"

[grid_mm.optimize]
trials = 20
sampler = "tpe"
seed = 42
weight_obj0 = 0.5
db_path = "optimizer.sqlite3"
study_name = "grid-2026-w35"
train_start = "2026-08-01"
train_end = "2026-08-06"
oos_start = "2026-08-08"
oos_end = "2026-08-09"
json_out = "study.json"
best_params_out = "best.toml"
snapshot_interval_ms = 3600000
account_id = "BYBIT-001"

[grid_mm.optimize.params.num_levels]
type = "int"
min = 1
max = 20

[grid_mm.optimize.params.grid_step_bps]
type = "int"
min = 1
max = 100

[grid_mm.optimize.params.requote_threshold_bps]
type = "int"
min = 0
max = 50

[grid_mm.optimize.params.skew_factor]
type = "float"
min = 0.0
max = 1.0

[grid_mm.optimize.params.max_position]
type = "float"
min = 10.0
max = 60.0

[grid_mm.optimize.params.trade_size]
type = "float"
min = 1.0
max = 20.0

[grid_mm.optimize.params.expire_time_secs]
type = "int"
min = 0
max = 300

[recorder]
exchange = "bybit"
trader_id = "TESTER-001"
instrument_id = ["OPUSDT-LINEAR.BYBIT", "BTCUSDT-LINEAR.BYBIT", "ETHUSDT-LINEAR.BYBIT", "XAUTUSDT-LINEAR.BYBIT"]
