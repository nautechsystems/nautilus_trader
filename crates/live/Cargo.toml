[package]
name = "nautilus-live"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Core live trading components and machinery for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_live"
crate-type = ["rlib"]

[features]
default = ["node", "plugin"]
fuzz = ["dep:libfuzzer-sys"]
node = [
  "dep:nautilus-data",
  "dep:nautilus-portfolio",
  "dep:nautilus-risk",
  "dep:nautilus-system",
  "dep:nautilus-trading",
]
plugin = ["node"]
examples = ["node", "dep:nautilus-testkit", "nautilus-trading/examples"]
streaming = ["node", "nautilus-persistence", "nautilus-system/streaming"]
extension-module = [
  "nautilus-common/extension-module",
  "nautilus-core/extension-module",
  "nautilus-execution/extension-module",
  "nautilus-model/extension-module",
  "python",
  "pyo3/extension-module",
  "streaming",
]
python = [
  "node",
  "nautilus-common/python",
  "nautilus-core/python",
  "nautilus-execution/python",
  "nautilus-model/python",
  "nautilus-persistence?/python",
  "nautilus-portfolio/python",
  "nautilus-system/python",
  "nautilus-testkit?/python",
  "nautilus-trading/python",
  "pyo3",
  "pyo3-stub-gen",
  "streaming",
]
defi = [
  "dep:nautilus-data",
  "nautilus-common/defi",
  "nautilus-data/defi",
  "nautilus-persistence?/defi",
]
simulation = [
  "node",
  "nautilus-common/simulation",
  "nautilus-execution/simulation",
]

[package.metadata.cargo-machete]
ignored = [
  "nautilus-persistence",
] # Optional dep activated only via the streaming feature

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["defi", "examples", "node", "plugin", "simulation", "streaming"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-common = { workspace = true, features = ["live"] }
nautilus-core = { workspace = true }
nautilus-execution = { workspace = true }
nautilus-model = { workspace = true, features = ["test-support"] }
nautilus-network = { workspace = true }

nautilus-data = { workspace = true, optional = true }
nautilus-persistence = { workspace = true, optional = true }
nautilus-portfolio = { workspace = true, optional = true }
nautilus-risk = { workspace = true, optional = true }
nautilus-system = { workspace = true, features = ["live"], optional = true }
nautilus-testkit = { workspace = true, default-features = false, features = [
  "testers",
], optional = true }
nautilus-trading = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
futures-util = { workspace = true }
indexmap = { workspace = true }
libfuzzer-sys = { workspace = true, optional = true }
log = { workspace = true }
parking_lot = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tabled = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
ustr = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nautilus-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }

bytes = { workspace = true }
criterion = { workspace = true }
madsim = { workspace = true }
rstest = { workspace = true }
rust_decimal_macros = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
toml = { workspace = true }
ustr = { workspace = true }

# Run with `cargo bench -p nautilus-live --bench runner`
[[bench]]
name = "runner"
harness = false

# Run with `cargo bench -p nautilus-live --bench queue_monitor`
[[bench]]
name = "queue_monitor"
harness = false
required-features = ["node"]

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["node"]
