[package]
name = "nautilus-persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Data persistence and storage for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_persistence"
crate-type = ["rlib"]

[features]
default = []
defi = ["nautilus-model/defi"]
cloud = [
  "object_store/aws",
  "object_store/azure",
  "object_store/gcp",
  "object_store/http",
]
extension-module = [
  "nautilus-core/extension-module",
  "nautilus-model/extension-module",
  "nautilus-serialization/extension-module",
  "python",
  "pyo3/extension-module",
]
python = [
  "nautilus-common/python",
  "nautilus-core/python",
  "nautilus-model/python",
  "nautilus-serialization/python",
  "pyo3",
  "pyo3-stub-gen",
  "cloud",
]
high-precision = [
  "nautilus-model/high-precision",
  "nautilus-testkit/high-precision",
  "nautilus-serialization/high-precision",
]

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["cloud", "defi", "high-precision"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-common = { workspace = true, features = ["live"] }
nautilus-core = { workspace = true }
nautilus-model = { workspace = true, features = ["test-support"] }
nautilus-persistence-macros = { workspace = true }
nautilus-serialization = { workspace = true, features = ["arrow"] }

ahash = { workspace = true }
anyhow = { workspace = true }
arrow = { workspace = true }
arrow-row = { workspace = true }
datafusion = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
log = { workspace = true }
object_store = { workspace = true }
parking_lot = { workspace = true }
parquet = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
unbounded-interval-tree = { workspace = true }
url = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nautilus-testkit = { workspace = true, default-features = false, features = [
  "datasets",
] }

criterion = { workspace = true }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
rust_decimal = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "persistence"
path = "benches/persistence.rs"
harness = false

[[bin]]
name = "to-json"
path = "bin/to_json.rs"
required-features = ["python"]
doc = false
test = false

[[bin]]
name = "to-parquet"
path = "bin/to_parquet.rs"
required-features = ["python"]
doc = false
test = false
