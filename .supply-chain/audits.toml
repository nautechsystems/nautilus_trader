notes = "Reviewed the build scripts, generated bindings, packaged sources, and bundled AWS-LC delta (5.2.0 -> 5.5.0). The bulk of the diff is the mechanical aws_lc_0_43_0_ to aws_lc_0_44_0_ symbol-prefix rename across generated bindings and generated-src. Build changes add an OPENSSL_SMALL size-optimized option plumbed through the cc, cmake, and nasm builders, a copy_writable that clears read-only permissions when staging prebuilt objects out of a read-only store, and a platform-specific library_filename for system-library probing. C changes are an upstream sync confined to fipsmodule, cipher_extra, chacha, and rsa_extra. The refreshed Windows prebuilt NASM objects stay gated behind use_prebuilt_nasm, which needs Windows x86_64, absent NASM, and explicit env or feature opt-in that this workspace does not set. No network fetch, credential, or new process behavior beyond local compiler probes."

