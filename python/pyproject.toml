[project]
name = "nautilus-trader"
version = "2.0.0rc4"
description = "Production-grade Rust-native trading engine with deterministic event-driven architecture"
authors = [{ name = "Nautech Systems", email = "info@nautechsystems.io" }]
classifiers = [
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering",
  "Topic :: Office/Business :: Financial",
  "Topic :: Office/Business :: Financial :: Investment",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
]
license = "LGPL-3.0-only"
license-files = ["LICENSE"]
readme = "../README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
visualization = [
  "pandas>=2.3.3,<4.0.0",
  "plotly>=6.9.0,<7.0.0",
  "kaleido>=1.3.0,<2.0.0",
  "simplejson>=4.1.1,<5.0.0",
]

[project.urls]
homepage = "https://nautilustrader.io"
repository = "https://github.com/nautechsystems/nautilus_trader"
docs = "https://nautilustrader.io/docs"

[build-system]
# Keep the maturin pin exact; scripts/maturin-version.bash uses it for CI wheel builds.
requires = ["maturin==1.14.1", "patchelf"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "../crates/pyo3/Cargo.toml"
module-name = "nautilus_trader._libnautilus"
python-source = "."
features = [
  "extension-module",
  "arrow",
  "betfair",
  "high-precision",
  "mimalloc",
  "redis",
  "postgres",
  "defi",
  "hypersync",
  "tracing-bridge",
]
strip = false

include = ["**/*.pyi"]

[tool.uv]
required-version = ">=0.12,<0.13"
exclude-newer = "7 days"
# Block sdist builds for every third-party package in python/uv.lock so
# unexpected loss of wheel publishing fails `uv lock` instead of silently
# building from source. Kept in sync with python/uv.lock by
# scripts/check-no-build-packages.sh (also a pre-commit hook). The local
# nautilus-trader package is intentionally absent because it must be built
# by maturin.
no-build-package = [
  "accessible-pygments",
  "alabaster",
  "babel",
  "beautifulsoup4",
  "certifi",
  "charset-normalizer",
  "choreographer",
  "click",
  "colorama",
  "coverage",
  "docutils",
  "execnet",
  "furo",
  "h11",
  "idna",
  "imagesize",
  "iniconfig",
  "jinja2",
  "kaleido",
  "linkify-it-py",
  "logistro",
  "markdown-it-py",
  "markupsafe",
  "maturin",
  "mdit-py-plugins",
  "mdurl",
  "myst-parser",
  "narwhals",
  "numpy",
  "orjson",
  "packaging",
  "pandas",
  "platformdirs",
  "plotly",
  "pluggy",
  "psutil",
  "pygments",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-xdist",
  "python-dateutil",
  "pyyaml",
  "requests",
  "roman-numerals",
  "ruff",
  "simplejson",
  "six",
  "snowballstemmer",
  "soupsieve",
  "sphinx",
  "sphinx-basic-ng",
  "sphinx-comments",
  "sphinxcontrib-applehelp",
  "sphinxcontrib-devhelp",
  "sphinxcontrib-htmlhelp",
  "sphinxcontrib-jsmath",
  "sphinxcontrib-qthelp",
  "sphinxcontrib-serializinghtml",
  "ty",
  "typing-extensions",
  "tzdata",
  "uc-micro-py",
  "urllib3",
  "uvicorn",
  "uvloop",
]

[dependency-groups]
dev = ["maturin==1.14.1", "ruff>=0.16.3", "ty>=0.0.73"]
test = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-xdist[psutil]>=3.8.0",
  "uvicorn>=0.52.4",
  "uvloop>=0.22.1; sys_platform != 'win32'",
]
docs = [
  "furo==2025.12.19",
  "linkify-it-py>=2.1.0,<3.0.0",
  "myst-parser>=5.1.0,<6.0.0",
  "sphinx-comments>=0.0.3,<1.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  "stubs/**",
  "nautilus_trader/_libnautilus.pyi",
  ".git",
  "../build",
  "../dist",
  "../.git",
  "../patches",
  "../target",
  "patches",
]

[tool.ruff.lint]
select = ["ALL"]

ignore = [
  "COM812", # Ruff formatter controls trailing commas
  "D200", # One-line docstrings use the multi-line form by convention (docformatter --make-summary-multi-line)
  "D203", # Conflicts with D211; ruff ignores D203 automatically, listed here to silence the warning
  "D212", # Multi-line docstring summaries start on the second line by convention (docformatter --pre-summary-newline); D213 applies instead
  "EM101", # Exception messages stay inline
  "EM102", # Exception messages stay inline
  "TRY003", # Exception messages stay inline
]

# Allow autofix for all enabled rules (when `--fix`) is provided
fixable = ["ALL"]

# E4 = import-related rules (E401: multiple imports on one line, E402: module level import not at top)
# E501 = line too long
# UP006 = Use list instead of List for type annotation (field name 'list' shadows built-in in Bybit schemas)
# UP035 = typing.List is deprecated (field name 'list' shadows built-in in Bybit schemas)
# Autofix is disabled for these rules; any violations are fixed manually
unfixable = ["E4", "E501", "UP006", "UP035"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"nautilus_trader/**/*.pyi" = [
  "A002",
  "ANN401",
  "CPY001",
  "D",
  "E501",
  "F401",
  "N802",
  "PYI011",
  "RUF002",
  "RUF100",
] # Generated stubs mirror Rust API names and types; E501 stays in the generator header too
"nautilus_trader/adapters/*/__init__.py" = [
  "F405",
] # Adapter facades re-export star-imported names in __all__
