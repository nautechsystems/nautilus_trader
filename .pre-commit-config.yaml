exclude: ^patches/pyo3-stub-gen/
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # nautilus-engineering: sync begin
  - repo: local
    hooks:
      - id: check-nautilus-engineering-sync
        name: check Nautilus engineering sync
        entry: bash scripts/check-nautilus-engineering-sync.bash --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: check-nautilus-engineering-pre-commit
        name: check Nautilus engineering pre-commit section
        entry: python3 scripts/manage-nautilus-engineering-pre-commit.py check --staged
        language: system
        pass_filenames: false
        always_run: true
  # nautilus-engineering: sync end

  ##############################################################################
  #  General checks
  ##############################################################################
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: forbid-new-submodules
      - id: end-of-file-fixer
        types_or: [rust, python, markdown]
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: debug-statements
      - id: detect-private-key
      - id: check-added-large-files
        exclude: ^crates/serialization/generated/capnp/
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml

  # nautilus-engineering: hooks begin
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: ["-i", "2", "-ci", "-sr", "-ln", "bash", "-w"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: taplo-format
        name: taplo-format
        entry: taplo format
        language: rust
        types: [toml]
        additional_dependencies:
          - cli:taplo-cli:0.10.0

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]
  # nautilus-engineering: hooks end

  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        name: dockerfile-lint
        description: Lint Dockerfiles for best practices and errors

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.1
    hooks:
      - id: typos
        description: Checks for common typos
        args: ["--force-exclude"]
        types_or: [rust, python, toml, yaml, rst, markdown]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        description: Checks for common misspellings
        types_or: [rust, python, toml, yaml, rst, markdown]

  - repo: https://github.com/gitleaks/gitleaks
    # Pinned to v8.30.1: autoupdate occasionally selects the lower v8.30.0 tag
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (secrets scan)
        description: Detects hard-coded secrets prior to commit
        args: ["--staged", "--redact"]

  ##############################################################################
  #  GitHub Actions linting (complementary tools covering different aspects)
  ##############################################################################
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint (syntax/structure)
        description: Checks GitHub Actions workflow syntax and structural correctness

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        name: zizmor (security)
        description: Scans GitHub Actions workflows for security misconfigurations
        args: ["--no-online-audits", "--strict-collection", "--min-severity", "informational", ".github/"]
        files: ^(\.github/.*\.ya?ml|\.pre-commit-config\.yaml)$
        pass_filenames: false

  ##############################################################################
  #  Custom hooks
  ##############################################################################
  - repo: local
    hooks:
      - id: check-commit-message
        name: check commit message
        description: Validates the pending commit subject, body, and AI attribution
        entry: python3 -B scripts/ci/check_commit_message.py
        language: system
        stages: [commit-msg]
        always_run: true
        verbose: true

      - id: check-hidden-chars
        name: check hidden unicode/control chars
        description: Fail on hidden control or zero-width unicode characters in source
        entry: bash .pre-commit-hooks/check_hidden_chars.sh
        language: system
        types_or: [rust, python, toml, markdown, yaml, json, text]
        files: "\\.(rs|py|toml|md|yml|yaml|json|sh|bash|dockerfile)$|Dockerfile.*"

      - id: check-unicode-typography
        name: check Unicode typography
        description: Reject non-breaking hyphens, typographic dashes, curly quotes, and emoji-style check/cross marks
        entry: bash .pre-commit-hooks/check_unicode_typography.sh
        language: system
        types: [text]

      - id: check-non-latin-text
        name: check non-Latin text
        description: Detect non-Latin characters (CJK, Cyrillic, Arabic, etc.) to enforce English-only
        entry: bash .pre-commit-hooks/check_non_latin_text.sh
        language: system
        types: [text]
        files: "\\.(rs|py|md|toml|yaml|yml)$"

      - id: check-toml-codegen
        name: check toml-codegen
        description: Ensures TOML files don't contain the 'codegen-backend' keyword
        entry: bash .pre-commit-hooks/check_toml_codegen.sh
        language: system
        files: \.toml$

      - id: check-no-build-packages
        name: check no-build-packages
        description: Ensures `[tool.uv].no-build-package` matches `uv.lock`
        entry: bash scripts/check-no-build-packages.sh --pair python/uv.lock:python/pyproject.toml
        language: system
        files: ^python/(uv\.lock|pyproject\.toml)$
        pass_filenames: false
        always_run: true

      - id: python-test-collection
        name: Python test collection
        description: Imports and collects the Python test tree against the existing extension
        entry: make pytest-collect-fast
        language: system
        files: ^(Makefile|python/(generate_stubs\.py|pyproject\.toml|uv\.lock|nautilus_trader/.*|tests/.*))$
        pass_filenames: false

      - id: check-copyright-year
        name: check copyright year
        description: Ensures copyright headers have current year
        entry: bash .pre-commit-hooks/check_copyright_year.sh
        language: system
        types_or: [rust, python]
        always_run: true
        pass_filenames: false

      - id: check-error-conventions
        name: check error conventions
        description: Enforces error variable naming conventions
        entry: bash .pre-commit-hooks/check_error_conventions.sh
        language: system
        types_or: [rust, python]
        pass_filenames: false

      - id: check-no-legacy-paths
        name: check no legacy paths
        description: Fails on removed Python namespace paths, Cython-conditioned deferrals, and unexpected FFI surfaces
        entry: bash .pre-commit-hooks/check_no_legacy_paths.sh
        language: system
        files: ^(crates|docs|examples|python)/|[.]md$|^(Cargo[.]toml|Makefile)$
        pass_filenames: false

      - id: check-links-offline
        name: check links (offline)
        description: Verifies all tracked internal markdown links resolve on disk via lychee
        entry: bash .pre-commit-hooks/check_links_offline.sh
        language: system
        always_run: true
        pass_filenames: false

  ##############################################################################
  #  Rust formatting and linting
  ##############################################################################
  - repo: local
    hooks:
      - id: check-anyhow-usage
        name: check anyhow usage
        description: Enforces anyhow conventions
        entry: bash .pre-commit-hooks/check_anyhow_usage.sh
        language: system
        files: "\\.rs$"
        pass_filenames: false

      - id: check-logging-conventions
        name: check logging conventions
        description: Enforces logging and process termination conventions
        entry: bash .pre-commit-hooks/check_logging_conventions.sh
        language: system
        files: "\\.rs$"
        pass_filenames: false

      - id: check-tokio-usage
        name: check tokio usage
        description: Enforces tokio usage conventions
        entry: bash .pre-commit-hooks/check_tokio_usage.sh
        language: system
        files: "\\.rs$|Cargo\\.toml$"
        pass_filenames: false

      - id: check-dst-conventions
        name: check DST conventions
        description: Enforces deterministic simulation testing path bans
        entry: bash .pre-commit-hooks/check_dst_conventions.sh
        language: system
        files: "\\.rs$"
        pass_filenames: false

      - id: check-pyo3-conventions
        name: check pyo3 conventions
        description: Enforces PyO3 naming conventions
        entry: bash .pre-commit-hooks/check_pyo3_conventions.sh
        language: system
        files: "\\.rs$"
        pass_filenames: false

      - id: check-ustr-conventions
        name: check ustr conventions
        description: Enforces Ustr interning conventions (no redundant re-interning)
        entry: bash .pre-commit-hooks/check_ustr_conventions.sh
        language: system
        files: "\\.rs$"
        pass_filenames: false

      - id: check-testing-conventions
        name: check testing conventions
        description: Enforces testing standardizations and conventions
        entry: bash .pre-commit-hooks/check_testing_conventions.sh
        language: system
        types_or: [rust, python]
        pass_filenames: false

      - id: check-nautilus-conventions
        name: check nautilus conventions
        description: Enforces Nautilus type usage conventions
        entry: bash .pre-commit-hooks/check_nautilus_conventions.sh
        language: system
        files: "\\.rs$"
        pass_filenames: false

      - id: check-formatting-rs
        name: check formatting (Rust)
        description: Enforces formatting conventions in Rust code
        entry: bash .pre-commit-hooks/check_formatting_rs.sh
        language: system
        files: "\\.rs$"
        pass_filenames: false

      - id: check-formatting-py
        name: check formatting (Python)
        description: Enforces formatting conventions in Python code
        entry: bash .pre-commit-hooks/check_formatting_py.sh
        language: system
        files: "\\.py$"
        pass_filenames: false

      - id: check-docs-conventions
        name: check docs conventions
        description: Enforces documentation conventions
        entry: bash .pre-commit-hooks/check_docs_conventions.sh
        language: system
        files: "(Cargo\\.toml|\\.(rs|md))$"
        pass_filenames: false

      - id: check-cargo-conventions
        name: check cargo conventions
        description: Enforces Cargo.toml dependency ordering conventions
        entry: bash .pre-commit-hooks/check_cargo_conventions.sh
        language: system
        files: "Cargo\\.toml$"
        pass_filenames: false

      - id: check-workspace-test-coverage
        name: check workspace test coverage
        description: Reconciles workspace members with Rust test selection
        entry: bash scripts/ci/check-workspace-test-coverage.sh
        language: system
        files: >-
          (?x)^(
            (?:.*/)?Cargo\.toml|
            .*\.rs|
            Makefile|
            scripts/ci/check-workspace-test-coverage\.sh
          )$
        pass_filenames: false

      - id: fmt
        name: cargo fmt
        description: Format files with cargo fmt
        entry: bash .pre-commit-hooks/cargo_fmt_stable.sh
        language: system
        args: ["--all", "--", "--check"]
        files: >-
          (?x)^(
            .*\.rs|
            (?:.*/)?Cargo\.toml|
            rustfmt\.toml|
            rust-toolchain\.toml
          )$
        types: [file]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Run the Clippy linter on changed crates
        entry: bash scripts/clippy-changed.sh
        language: system
        files: >-
          (?x)^(
            .*\.rs|
            (?:.*/)?Cargo\.toml|
            Cargo\.lock|
            clippy\.toml|
            rust-toolchain\.toml|
            python/pyproject\.toml|
            \.cargo/config\.toml|
            scripts/cargo-features\.bash
          )$
        types: [file]
        pass_filenames: false

      - id: cargo-clippy-network-turmoil-non-linux
        name: cargo clippy network turmoil (non-Linux)
        description: Run the network Turmoil Clippy check on non-Linux hosts
        entry: bash .pre-commit-hooks/cargo_clippy_network_turmoil_non_linux.sh
        language: system
        files: >-
          (?x)^(
            crates/network/.*\.rs|
            crates/network/Cargo\.toml|
            Cargo\.toml|
            clippy\.toml|
            rust-toolchain\.toml|
            \.cargo/config\.toml
          )$
        types: [file]
        pass_filenames: false

      - id: cargo-doc
        name: cargo doc
        description: Check documentation builds on changed crates
        entry: bash scripts/doc-changed.sh
        language: system
        files: >-
          (?x)^(
            .*\.rs|
            (?:.*/)?Cargo\.toml|
            Cargo\.lock|
            rust-toolchain\.toml|
            python/pyproject\.toml|
            \.cargo/config\.toml|
            scripts/cargo-features\.bash
          )$
        types: [file]
        pass_filenames: false

      - id: cargo-machete
        name: cargo machete
        description: Detect declared-but-unused dependencies in changed Rust packages
        entry: bash .pre-commit-hooks/cargo_machete.sh
        language: system
        files: >-
          (?x)^(
            Cargo\.toml|
            crates/.*(?:Cargo\.toml|\.rs)|
            examples/tutorials/.*(?:Cargo\.toml|\.rs)|
            examples/quickstarts/lighter-rust-data-client/.*(?:Cargo\.toml|\.rs)|
            \.pre-commit-hooks/cargo_machete\.sh
          )$
        always_run: true
        pass_filenames: false

      - id: cargo-cooldown
        name: cargo cooldown
        description: Blocks crate versions published inside the cooldown window
        entry: bash scripts/check-cargo-cooldown.sh
        language: system
        files: >-
          (?x)^(
            (?:.*/)?Cargo\.(lock|toml)|
            scripts/check-cargo-cooldown\.sh
          )$
        pass_filenames: false

  ##############################################################################
  #  Python formatting and linting
  ##############################################################################
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: ["--py312-plus"]

  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      - id: add-trailing-comma
        name: add-trailing-comma
        types: [python]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        name: ruff
        args: ["--fix", "--config", "python/pyproject.toml"]
      - id: ruff-format
        name: ruff-format
        args: ["--config", "python/pyproject.toml"]

  - repo: https://github.com/PyCQA/docformatter
    # Pinned to 1.7.7 because v1.7.8 conflicts with this repo's Ruff docstring rules
    rev: v1.7.7
    hooks:
      - id: docformatter
        language_version: python3.13 # Pin to 3.13 due to incompatibility with 3.14
        additional_dependencies: [tomli]
        exclude: ^scripts/(check-markdown-tables|security-audit)\.py$
        args:
          - "--wrap-summaries"
          - "88"
          - "--wrap-descriptions"
          - "88"
          - "--make-summary-multi-line"
          - "--pre-summary-newline"
          - "--blank"
          - "--recursive"
          - "--in-place"

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.6 # Must match [uv] in .nautilus-engineering/tools.toml
    hooks:
      - id: uv-lock
        args: ["--project", "python"]
        files: ^python/(uv\.lock|pyproject\.toml)$

  - repo: local
    hooks:
      - id: ty
        name: ty
        description: Type-checks Python examples
        entry: bash scripts/ci/check-python-types.bash python examples
        language: system
        files: >-
          (?x)^(
            Makefile|
            docs/tutorials/.*\.py|
            examples/.*\.py|
            python/(nautilus_trader/.*|pyproject\.toml|uv\.lock)|
            scripts/ci/check-python-types\.bash
          )$
        pass_filenames: false

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  ##############################################################################
  #  Markdown formatting and linting
  ##############################################################################
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        name: markdownlint
        entry: markdownlint-cli2
        args:
          - --config
          - .markdownlint.jsonc
          - --fix
        files: "\\.md$"
        exclude: "^(CLA\\.md|RELEASES\\.md)$"

  - repo: local
    hooks:
      - id: check-markdown-tables
        name: normalize markdown table padding
        description: Pads GFM table columns to their widest cell, which MD060 does not check
        entry: python3 -B scripts/check-markdown-tables.py
        language: system
        types: [markdown]

      - id: mermaid-lint
        name: mermaid lint
        description: Validates Mermaid diagrams embedded in Markdown files
        entry: mermaid-lint
        language: node
        additional_dependencies: ["@mermaid-lint/cli@0.35.0"]
        args: [--fix, --no-semantic, --quiet]
        types: [markdown]
