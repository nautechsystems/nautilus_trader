# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

# =============================================================================
# Dependency Graph Configuration
# =============================================================================
[graph]
all-features = true
no-default-features = false

[output]
feature-depth = 1

# =============================================================================
# Security Advisories
# =============================================================================
[advisories]
unused-ignored-advisory = "deny"
# Ignored advisories (use sparingly - document the reason)
ignore = [
  # paste unmaintained, transitive via alloy
  # TODO: Monitor https://github.com/alloy-rs/alloy for migration to pastey or alternative
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained, transitive via alloy" },

  # unic-* unmaintained, transitive via pyo3-stub-gen -> rustpython-parser (dev tool only).
  # TODO: Monitor https://github.com/Jij-Inc/pyo3-stub-gen for migration away from rustpython-parser
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range unmaintained, transitive via pyo3-stub-gen (dev tool only)" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common unmaintained, transitive via pyo3-stub-gen (dev tool only)" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property unmaintained, transitive via pyo3-stub-gen (dev tool only)" },
  { id = "RUSTSEC-2025-0090", reason = "unic-emoji-char unmaintained, transitive via pyo3-stub-gen (dev tool only)" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version unmaintained, transitive via pyo3-stub-gen (dev tool only)" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident unmaintained, transitive via pyo3-stub-gen (dev tool only)" },

  # bincode 1.3.3 unmaintained, transitive via madsim and hypersync-client. Not a vulnerability.
  # TODO: Monitor madsim and hypersync-client upstreams for migration
  { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained, transitive via madsim and hypersync-client (not a vulnerability)" },

  # capnp unsound APIs in constant::Reader and StructSchema, transitive via hypersync-client.
  # Generated code supplies static schema metadata; no remote schema input path is known.
  { id = "RUSTSEC-2025-0143", reason = "capnp unsound APIs, transitive via hypersync-client, awaiting upstream fix" },

  # quick-xml duplicate-attribute check DoS, transitive via object_store 0.13.2.
  # object_store 0.14 is fixed, but the current DataFusion release requires object_store 0.13.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml DoS via DataFusion-aligned object_store 0.13.2" },

  # quick-xml NsReader namespace-allocation DoS, transitive via object_store 0.13.2.
  # object_store 0.14 is fixed, but the current DataFusion release requires object_store 0.13.
  { id = "RUSTSEC-2026-0195", reason = "quick-xml NsReader DoS via DataFusion-aligned object_store 0.13.2" },

  # NOTE: lockfile scanners also flag RUSTSEC-2024-0388 (derivative), which cargo-deny
  # does not surface. Its scanner-specific ignores are in .cargo/audit.toml and
  # osv-scanner.toml.
]

# =============================================================================
# License Configuration
# =============================================================================
[licenses]
# Licenses compatible with LGPL-3.0
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-2-Clause-Patent",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MPL-2.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Zlib",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "0BSD",
  "LGPL-3.0-only",
  "Unlicense",
  "bzip2-1.0.6",
]

# libfuzzer-sys bundles LLVM's libFuzzer runtime under NCSA
exceptions = [{ allow = ["NCSA"], crate = "libfuzzer-sys@0.4.13" }]

confidence-threshold = 0.8

# Clarify licenses for crates with missing/incorrect license metadata
[[licenses.clarify]]
name = "implied-vol"
version = "*"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0x526ab6d5 }]

# dydx-proto uses "LicenseRef-dYdX-Custom" but is effectively MIT licensed.
# The dYdX custom license is a permissive license compatible with MIT terms.
# See: https://github.com/dydxprotocol/v4-chain/blob/main/LICENSE
[[licenses.clarify]]
name = "dydx-proto"
version = "*"
expression = "MIT"
license-files = []

[licenses.private]
# Ignore workspace crates that aren't published
# Note: All workspace crates in this project are LGPL-3.0 (project license)
# If adding workspace crates with different licenses, set this to false
ignore = true
registries = []

# =============================================================================
# Banned/Duplicate Crates
# =============================================================================
[bans]
# Deny multiple versions of the same crate to catch new duplicates we introduce.
# Known transitive duplicates from upstream are allowlisted in `skip` below.
# Review this list periodically when upgrading dependencies.
multiple-versions = "deny"

# Deny wildcard version requirements (*)
# Prevents uncontrolled version drift and supply-chain attacks
wildcards = "deny"

highlight = "all"

workspace-default-features = "allow"
external-default-features = "allow"

# Explicitly allowed crates (use with care)
allow = []

# Explicitly denied crates
deny = []

# Skip certain crates during duplicate detection.
# These are transitive duplicates from upstream crates outside our control.
# Each entry covers only the older versions, so a new duplicate still fails.
# Last reviewed: 2026-09-29
skip = [
  # Crypto ecosystem - version-locked together, pulled by various blockchain crates
  { crate = "block-buffer:<0.12" },
  { crate = "const-oid:<0.10" },
  { crate = "crypto-common:<0.2" },
  { crate = "digest:<0.11" },
  { crate = "hmac:<0.13" },
  { crate = "md-5:<0.11" },
  { crate = "sha1:<0.11" },
  { crate = "sha2:<0.11" },

  # RNG ecosystem - version-locked together, pulled by crypto and blockchain crates
  { crate = "getrandom:<0.4" },
  { crate = "r-efi:<6" },
  { crate = "rand:<0.10" },
  { crate = "rand_chacha:<0.9" },
  { crate = "rand_core:<0.10" },

  # Proc-macro support crates - transitive via derive macros in various crates
  { crate = "darling:<0.24" },
  { crate = "darling_core:<0.24" },
  { crate = "darling_macro:<0.24" },
  { crate = "derive_more:<2" },
  { crate = "derive_more-impl:<2" },

  # syn 1 and strsim 0.10 - transitive via madsim -> darling 0.14 (dev-only simulator)
  { crate = "syn:<3" },
  { crate = "strsim:<0.11" },

  # Enum derive macros - strum 0.27 (alloy, hypersync) vs 0.28 (nautilus)
  { crate = "strum:<0.28" },
  { crate = "strum_macros:<0.28" },

  # Case conversion - version fragmentation via derive_more
  { crate = "convert_case:<0.10" },

  # Arrow/Parquet compatibility facades - hypersync requires the 57.x package IDs
  { crate = "arrow:<59" },
  { crate = "parquet:<59" },

  # Common utility crates with version fragmentation across ecosystem
  # base64 0.23 is used directly; upstream dependencies still require 0.22
  { crate = "base64:<0.23" },
  { crate = "hashbrown:<0.17" },
  { crate = "itertools:<0.15" },
  { crate = "foldhash:<0.2" },
  { crate = "num-bigint:<0.5" },
  { crate = "petgraph:<0.8" },

  # Signature traits - v2 via cosmrs/tendermint, v3 via ed25519-dalek
  { crate = "ed25519:<3" },
  { crate = "signature:<3" },

  # Perfect hash function crates - transitive
  { crate = "phf:<0.14" },
  { crate = "phf_shared:<0.14" },

  # Error handling - thiserror 1.x vs 2.x transition in progress
  { crate = "thiserror:<2" },
  { crate = "thiserror-impl:<2" },

  # CPU feature detection - cpufeatures 0.2 vs 0.3 (const-hex vs chacha20/rand)
  { crate = "cpufeatures:<0.3" },

  # HTTP client - reqwest 0.12 vs 0.13 transition (databento, hypersync, object_store on 0.12)
  { crate = "reqwest:<0.13" },
  { crate = "wasm-streams:<0.5" },

  # Reqwest requires tower-http 0.6; the direct HTTP transport uses 0.7
  { crate = "tower-http:<0.7" },

  # Protobuf runtime - dYdX/cosmos/tonic use 0.13, ibapi uses 0.14
  { crate = "prost:<0.14" },
  { crate = "prost-derive:<0.14" },

  # Cap'n Proto - hypersync-client uses 0.23.x, nautilus-serialization uses 0.27.x
  { crate = "capnp:<0.27" },

  # TOML parser - cbindgen requires 0.9.x; the workspace and pyo3-stub-gen use 1.x
  { crate = "toml:<1" },
  { crate = "toml_datetime:<1" },
  { crate = "winnow:<1" },

  # TLS roots - version fragmentation in TLS ecosystem
  { crate = "webpki-roots:<1" },

  # Windows platform crates - notoriously fragmented across Windows SDK versions
  { crate = "windows-sys:<0.61" },

  # Arrow and Parquet retain zstd 0.13 while compression-codecs and Databento use 0.14
  { crate = "zstd:=0.13.3" },
  { crate = "zstd-safe:=7.3.0" },
]

skip-tree = []

# =============================================================================
# Dependency Sources
# =============================================================================
[sources]
# Only allow dependencies from crates.io
unknown-registry = "deny"
unknown-git = "deny"

allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
