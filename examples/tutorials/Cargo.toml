[package]
name = "nautilus-tutorials"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Runnable tutorial examples for NautilusTrader"
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
examples = [
  "dep:anyhow",
  "dep:dotenvy",
  "dep:nautilus-backtest",
  "dep:nautilus-common",
  "dep:nautilus-core",
  "dep:nautilus-data",
  "dep:nautilus-databento",
  "dep:nautilus-execution",
  "dep:nautilus-finfeed",
  "dep:nautilus-lighter",
  "dep:nautilus-live",
  "dep:nautilus-model",
  "dep:nautilus-persistence",
  "dep:nautilus-trading",
  "dep:rust_decimal",
  "dep:rust_decimal_macros",
  "dep:tokio",
]

[package.metadata.cargo-machete]
ignored = [
  "rust_decimal", # Used by the `dec!` macro expansion in the FinFeed tutorial binary
]

[dependencies]
nautilus-backtest = { workspace = true, features = [
  "streaming",
], optional = true }
nautilus-common = { workspace = true, features = ["live"], optional = true }
nautilus-core = { workspace = true, optional = true }
nautilus-data = { workspace = true, optional = true }
nautilus-databento = { workspace = true, features = [
  "high-precision",
  "live",
], optional = true }
nautilus-execution = { workspace = true, optional = true }
nautilus-finfeed = { workspace = true, features = [
  "high-precision",
], optional = true }
nautilus-lighter = { workspace = true, features = [
  "examples",
  "high-precision",
], optional = true }
nautilus-live = { workspace = true, features = ["node"], optional = true }
nautilus-model = { workspace = true, features = [
  "high-precision",
], optional = true }
nautilus-persistence = { workspace = true, optional = true }
nautilus-trading = { workspace = true, features = [
  "examples",
  "high-precision",
], optional = true }

anyhow = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
rust_decimal_macros = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[[bin]]
name = "finfeed-polymarket-book-imbalance"
path = "src/bin/finfeed_polymarket_book_imbalance.rs"
required-features = ["examples"]
doc = false
test = false

[[bin]]
name = "lighter-nvda-composite-mm"
path = "src/bin/lighter_nvda_composite_mm.rs"
required-features = ["examples"]
doc = false
test = false
