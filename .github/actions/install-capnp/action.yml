name: install-capnp
description: Install Cap'n Proto compiler

inputs:
  cache-enabled:
    description: Whether to restore/save the Cap'n Proto compiler cache on Linux
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install capnp and ripgrep (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew untap aws/tap 2>/dev/null || true
        brew install capnp ripgrep || { sleep 5; brew install capnp ripgrep; }
        brew cleanup

    - name: Add Cap'n Proto to PATH (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: | # zizmor: ignore[github-env] The fixed repository cache path must be added to PATH.
        echo "$GITHUB_WORKSPACE/.cache/capnp/bin" >> "$GITHUB_PATH"

    - name: Get Linux version
      if: runner.os == 'Linux'
      id: linux-version
      shell: bash
      run: echo "release=$(lsb_release -rs)" >> "$GITHUB_OUTPUT"

    - name: Get Cap'n Proto version
      if: runner.os == 'Linux'
      id: capnp-version
      shell: bash
      run: |
        printf 'version=%s\n' "$(bash scripts/tool-version.sh capnp)" >> "$GITHUB_OUTPUT"

    - name: Cache Cap'n Proto (Linux)
      if: runner.os == 'Linux' && inputs.cache-enabled == 'true'
      id: cache-capnp
      # https://github.com/actions/cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.cache/capnp
        # yamllint disable rule:line-length
        key: capnp-linux-${{ steps.linux-version.outputs.release }}-${{ steps.capnp-version.outputs.version }}-${{ runner.arch
          }}
        # yamllint enable rule:line-length

    - name: Install capnp (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        CAPNP_PREFIX: ${{ github.workspace }}/.cache/capnp
      run: bash scripts/install-capnp.sh

    - name: Install capnp (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |-
        choco install capnproto ripgrep -y || {
          echo "capnproto/ripgrep install via choco failed or unavailable"
          sleep 5
          choco install capnproto ripgrep -y || true
        }
