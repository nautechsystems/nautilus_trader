name: Upload wheel artifact to GitHub Actions
description: Upload wheel artifact to GitHub Actions

inputs:
  retention-days:
    description: Number of days to retain the uploaded wheel artifact
    required: false
    default: "1"

runs:
  using: "composite"
  steps:
    - name: Get wheel artifact name
      shell: bash
      if: >-
        github.event_name == 'push' &&
        (github.ref_name == 'develop' || github.ref_name == 'nightly' ||
        github.ref_name == 'master' || github.ref_name == 'test-ci')
      id: vars
      run: |
        asset_name="$(bash scripts/ci/validate-wheel-upload.bash)"
        printf 'asset_name=%s\n' "$asset_name" >> "$GITHUB_OUTPUT"

    - name: Upload wheel artifact
      if: >-
        github.event_name == 'push' &&
        (github.ref_name == 'develop' || github.ref_name == 'nightly' ||
        github.ref_name == 'master' || github.ref_name == 'test-ci')
      # Use wildcard to flatten dist/ prefix: path before first wildcard is stripped
      # https://github.com/actions/upload-artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.vars.outputs.asset_name }}
        path: dist/nautilus_trader-*.whl
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}
