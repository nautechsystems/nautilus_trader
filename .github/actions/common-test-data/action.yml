name: common-test-data
description: Common test data caching

runs:
  using: "composite"
  steps:
    - name: Cache test data
      # Skip on macOS: hashFiles() broken in composite actions after Nov 20 runner update
      # See: https://github.com/actions/runner/issues/3765
      if: runner.os != 'macOS'
      # The post step saves files downloaded by the Rust tests on a cache miss.
      # https://github.com/actions/cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Keep the tracked checksum manifest from the checked-out commit.
        path: tests/test_data/large/*.parquet
        key: large-files-${{ hashFiles('tests/test_data/large/checksums.json') }}
        restore-keys: large-files-
        enableCrossOsArchive: true
