name: cargo-tool-install
description: Install a cargo tool with caching

inputs:
  tool-name:
    description: The cargo tool to install (e.g., cargo-deny, cargo-vet)
    required: true

outputs:
  version:
    description: The installed tool version
    value: ${{ steps.get-version.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Get tool version
      id: get-version
      shell: bash
      env:
        TOOL_NAME: ${{ inputs.tool-name }}
      run: | # zizmor: ignore[github-env] All callers use fixed repository tool metadata
        VERSION=$(bash scripts/cargo-tool-version.sh "$TOOL_NAME")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "TOOL_VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "TOOL_NAME=$TOOL_NAME" >> "$GITHUB_ENV"

    - name: Get Rust toolchain version
      shell: bash
      run: | # zizmor: ignore[github-env] Version comes from repository toolchain metadata
        TOOLCHAIN="$(bash scripts/rust-toolchain.sh)"
        echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

    - name: Set up Rust toolchain
      # https://github.com/actions-rust-lang/setup-rust-toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        toolchain: ${{ env.TOOLCHAIN }}
        override: true

    - name: Cache tool binary
      # https://github.com/actions/cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.tool_cache }}/${{ inputs.tool-name }}
        key: ${{ inputs.tool-name }}-bin-${{ env.TOOL_VERSION }}-${{ runner.os }}-${{ env.TOOLCHAIN }}

    - name: Add tool to PATH
      shell: bash
      env:
        TOOL_CACHE: ${{ runner.tool_cache }}
      run: | # zizmor: ignore[github-env] Tool name comes from fixed repository callers
        echo "$TOOL_CACHE/$TOOL_NAME/bin" >> "$GITHUB_PATH"

    - name: Install tool
      shell: bash
      env:
        TOOL_CACHE: ${{ runner.tool_cache }}
      run: |-
        if [[ -x "$TOOL_CACHE/$TOOL_NAME/bin/$TOOL_NAME" ]]; then
          echo "$TOOL_NAME $TOOL_VERSION already installed from cache"
        else
          cargo install --locked \
            --root "$TOOL_CACHE/$TOOL_NAME" \
            --version "$TOOL_VERSION" \
            "$TOOL_NAME"
        fi
