name: common-setup
description: Common environment setup

inputs:
  python-version:
    description: The Python version to setup
    required: true
  free-disk-space:
    description: Free disk space
    required: false
    default: "false"
  free-disk-space-max-build:
    description: Remove additional tools unused by large Linux build jobs
    required: false
    default: "false"
  build-type:
    description: Type of build (pre-commit, test, release)
    required: false
    default: "release"
  rust-cache-key:
    description: Extra rust-cache key material to partition cache entries
    required: false
    default: ""
  rust-cache-workspaces:
    description: Optional rust-cache workspace mapping, e.g. ". -> target/py3.13"
    required: false
    default: ""
  rust-cache-on-failure:
    description: Whether to save the Rust cache when the job fails
    required: false
    default: "true"
  rust-cache-save-if:
    description: Whether to save the Rust cache (set to false for read-only cache on PR builds)
    required: false
    default: "true"
  rust-cache-enabled:
    description: >-
      Whether to invoke Swatinem/rust-cache at all (set to false on self-hosted
      runners using a persistent on-disk CARGO_TARGET_DIR).
    required: false
    default: "true"
  uv-cache-enabled:
    description: >-
      Whether to persist the uv cache with GitHub Actions cache: true, false, or
      auto (enabled on GitHub-hosted runners, disabled on self-hosted runners and
      macOS runners).
    required: false
    default: "auto"
  prek-cache-enabled:
    description: >-
      Whether to persist the prek cache with GitHub Actions cache: true, false, or
      auto (enabled on GitHub-hosted runners, disabled on self-hosted runners).
    required: false
    default: "auto"
  capnp-cache-enabled:
    description: Whether to restore/save the Cap'n Proto compiler cache
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    # > --------------------------------------------------
    # > OS
    # Auto-skip on the nautilus-ci-runner-* self-hosted pool: those machines
    # have ample disk and the tool-cache/docker-images cleanup actively erases
    # the pre-installed Python toolcache and cached Docker layers we want to
    # keep across runs. Depot runners and GitHub-hosted runners still need the
    # cleanup, so they remain unaffected.
    - name: Free disk space (Linux)
      if: >-
        inputs.free-disk-space == 'true'
        && runner.os == 'Linux'
        && !startsWith(runner.name, 'nautilus-ci-runner-')
      shell: bash
      env:
        BUILD_TYPE: ${{ inputs.build-type }}
        MAX_BUILD: ${{ inputs.free-disk-space-max-build }}
        RUNNER_ENV: ${{ runner.environment }}
      run: |
        args="--android --dotnet --docker-images --swap-storage"
        if [ "$BUILD_TYPE" != "pre-commit" ]; then
          args="$args --tool-cache --haskell --large-packages"
        fi
        if [ "$RUNNER_ENV" = "github-hosted" ]; then
          args="$args --extra"
        fi
        if [ "$MAX_BUILD" = "true" ]; then
          args="$args --max-build"
        fi
        bash scripts/ci/free-disk-space.sh $args

    - name: Free disk space (macOS)
      if: inputs.free-disk-space == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        echo "=== Disk usage before cleanup ==="
        df -h /
        sudo rm -rf /Library/Developer/CoreSimulator || true
        sudo rm -rf ~/Library/Android || true
        sudo rm -rf /usr/local/share/dotnet || true
        sudo rm -rf /usr/local/share/powershell || true
        sudo rm -rf /usr/local/.ghcup || true
        echo "=== Disk usage after cleanup ==="
        df -h /

    - name: Free disk space (Windows)
      if: inputs.free-disk-space == 'true' && runner.os == 'Windows'
      shell: bash
      env:
        BUILD_TYPE: ${{ inputs.build-type }}
      run: |
        rm -rf "/c/Program Files/dotnet"
        rm -rf "/c/Android"
        rm -rf /c/hostedtoolcache/windows/Java_*
        rm -rf "/c/hostedtoolcache/windows/CodeQL"
        rm -rf "/c/Miniconda"
        rm -rf "/c/Strawberry"
        if [ "$BUILD_TYPE" != "pre-commit" ]; then
          rm -rf "/c/Program Files (x86)/Microsoft Visual Studio/2019"
        fi

    - name: Add swap space (Linux ARM)
      if: >-
        inputs.build-type != 'pre-commit' &&
        inputs.free-disk-space == 'true' &&
        runner.os == 'Linux' &&
        (runner.arch == 'ARM64' || runner.arch == 'aarch64')
      shell: bash
      run: bash scripts/ci/configure-linux-swap.bash

    - name: Install runner dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -o Acquire::Retries=5
        sudo apt-get install -y curl clang lld git make pkg-config ripgrep -o Acquire::Retries=5
        sudo apt-get install -y python3-dev libpython3-dev -o Acquire::Retries=5
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*

    - name: Install Cap'n Proto
      uses: ./.github/actions/install-capnp
      with:
        cache-enabled: ${{ inputs.capnp-cache-enabled }}

    # > --------------------------------------------------
    # > Rust
    # GitHub runners come with a pre-installed Rust toolchain, this step forces an update
    # to ensure we have the latest version before setting our specific toolchain.
    # setup-rust-toolchain should handle this with override: true, but doesn't seem to work.
    - name: Reset and update Rust toolchain
      shell: bash
      run: bash scripts/ci/install-rust.sh

    - name: Get Rust toolchain version
      id: rust-toolchain
      shell: bash
      run: |
        TOOLCHAIN="$(bash scripts/rust-toolchain.sh)"
        printf 'toolchain=%s\n' "$TOOLCHAIN" >> "$GITHUB_OUTPUT"

    - name: Set up Rust toolchain
      # https://github.com/actions-rust-lang/setup-rust-toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
        components: clippy,rustfmt
        cache: false
        override: true

    - name: Rust cache
      if: inputs.rust-cache-enabled == 'true'
      # https://github.com/Swatinem/rust-cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: ${{ inputs.rust-cache-workspaces || '. -> target' }}
        cache-on-failure: ${{ inputs.rust-cache-on-failure }}
        key: ${{ inputs.rust-cache-key }}
        save-if: ${{ inputs.rust-cache-save-if }}

    - name: Get cargo-nextest version
      if: inputs.build-type != 'pre-commit'
      id: nextest-version
      shell: bash
      run: |
        version="$(bash scripts/cargo-tool-version.sh cargo-nextest)"
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

    - name: Install cargo-nextest
      if: inputs.build-type != 'pre-commit' && runner.os != 'macOS'
      # https://github.com/taiki-e/install-action
      uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
      with:
        tool: cargo-nextest@${{ steps.nextest-version.outputs.version }}

    - name: Install cargo-nextest (macOS)
      if: inputs.build-type != 'pre-commit' && runner.os == 'macOS'
      shell: bash
      env:
        CARGO_NEXTEST_VERSION: ${{ steps.nextest-version.outputs.version }}
      run: bash scripts/ci/install-cargo-nextest.sh "$CARGO_NEXTEST_VERSION"

    - name: Set CARGO_INCREMENTAL=0 for CI
      if: inputs.build-type != 'pre-commit'
      shell: bash
      run: echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

    # > --------------------------------------------------
    # > Python
    - name: Set up Python environment
      # https://github.com/actions/setup-python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Ensure ~/.local/bin on PATH
      shell: bash
      run: | # zizmor: ignore[github-env] The fixed user binary directory must be added to PATH.
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Get cache scope
      id: cache-scope
      shell: bash
      env:
        CACHE_SCOPE: ${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python-version }}
      run: |
        printf 'value=%s\n' "$CACHE_SCOPE" >> "$GITHUB_OUTPUT"

    - name: Get pre-commit config hash
      if: inputs.build-type == 'pre-commit'
      id: pre-commit-hash
      shell: bash
      run: |
        python - <<'PY' >> "$GITHUB_OUTPUT"
        import hashlib
        from pathlib import Path

        print(
            f"value={hashlib.sha256(Path('.pre-commit-config.yaml').read_bytes()).hexdigest()}"
        )
        PY

    - name: Install prek
      if: inputs.build-type == 'pre-commit'
      shell: bash
      run: |
        PREK_VERSION="$(bash scripts/tool-version.sh prek)"
        bash scripts/ci/install-prek.sh "$PREK_VERSION"

    # > --------------------------------------------------
    # > UV
    - name: Get uv version from pyproject.toml
      id: uv-version
      shell: bash
      run: |
        printf 'version=%s\n' "$(bash scripts/uv-version.sh)" >> "$GITHUB_OUTPUT"

    - name: Install uv
      # https://github.com/astral-sh/setup-uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: ${{ steps.uv-version.outputs.version }}
        enable-cache: >-
          ${{ inputs.uv-cache-enabled == 'auto'
          && runner.os == 'macOS'
          && 'false'
          || inputs.uv-cache-enabled }}
        cache-suffix: ${{ steps.cache-scope.outputs.value }}-uv-${{ steps.uv-version.outputs.version }}
        prune-cache: true

    # Self-hosted and macOS runners skip setup-uv's cache post-step under auto.
    - name: Prune uv cache
      shell: bash
      run: uv cache prune --ci

    # > --------------------------------------------------
    # > prek (pre-commit hook environments)
    - name: Cached pre-commit environments
      # Skip on macOS: hashFiles() broken in composite actions, see actions/runner#3765
      if: >-
        inputs.build-type == 'pre-commit'
        && runner.os != 'macOS'
        && (inputs.prek-cache-enabled == 'true'
            || (inputs.prek-cache-enabled == 'auto'
                && runner.environment != 'self-hosted'))
      id: cached-prek
      # https://github.com/actions/cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/prek
        key: ${{ steps.cache-scope.outputs.value }}-prek-${{ steps.pre-commit-hash.outputs.value }}
        restore-keys: |
          ${{ steps.cache-scope.outputs.value }}-prek-

    # > --------------------------------------------------
    # > Cache footprint
    - name: Report cache footprint
      if: runner.os != 'Windows'
      shell: bash
      run: |-
        {
          echo "## Cache footprint"
          echo
          echo '```'
          df -h "$HOME" 2>/dev/null || df -h /
          echo
          for path in \
            "$HOME/.cache/uv" \
            "$HOME/.cache/prek" \
            "$HOME/.cache/cargo-target" \
            "$HOME/.cargo/registry" \
            "$HOME/.cargo/git"; do
            [ -d "$path" ] && du -sh "$path" 2>/dev/null || true
          done
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
