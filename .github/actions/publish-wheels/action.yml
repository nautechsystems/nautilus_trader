name: Publish wheels (R2)
description: Publish wheels to Cloudflare R2

runs:
  using: "composite"
  steps:
    - name: Validate wheel artifacts
      shell: bash
      env:
        PUBLISH_WHEELS_MANIFEST: ${{ runner.temp }}/publish-wheels-manifest.tsv
      run: bash scripts/ci/validate-wheel-artifacts.bash "$PUBLISH_WHEELS_MANIFEST"

    - name: Configure AWS CLI for Cloudflare R2
      shell: bash
      env:
        AWS_EC2_METADATA_DISABLED: "true"
      run: bash scripts/ci/configure-r2-aws.bash

    - name: Publish and verify wheels
      shell: bash
      env:
        AWS_EC2_METADATA_DISABLED: "true"
        PUBLISH_WHEELS_MANIFEST: ${{ runner.temp }}/publish-wheels-manifest.tsv
        PUBLISH_WHEELS_DELETE_MANIFEST: ${{ runner.temp }}/publish-wheels-delete.txt
        PUBLISH_WHEELS_INDEX_FILE: ${{ runner.temp }}/publish-wheels-index.html
      run: bash scripts/ci/publish-wheels-r2.bash
