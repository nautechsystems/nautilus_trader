name: Download wheel artifacts with retry
description: Download wheel artifacts with bounded retry for transient GitHub failures.

runs:
  using: composite
  steps:
    - name: Download wheel artifacts (attempt 1/3)
      id: download-1
      continue-on-error: true
      # https://github.com/actions/download-artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist
        pattern: "nautilus_trader-*.whl"
        merge-multiple: true
        digest-mismatch: error

    - name: Backoff before retry 2
      if: steps.download-1.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::Wheel artifact download failed; retrying in 10s"
        rm -rf dist
        sleep 10

    - name: Download wheel artifacts (attempt 2/3)
      id: download-2
      if: steps.download-1.outcome == 'failure'
      continue-on-error: true
      # https://github.com/actions/download-artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist
        pattern: "nautilus_trader-*.whl"
        merge-multiple: true
        digest-mismatch: error

    - name: Backoff before retry 3
      if: steps.download-1.outcome == 'failure' && steps.download-2.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::Wheel artifact download failed; retrying in 30s"
        rm -rf dist
        sleep 30

    - name: Download wheel artifacts (attempt 3/3, final)
      id: download-3
      if: steps.download-1.outcome == 'failure' && steps.download-2.outcome == 'failure'
      # https://github.com/actions/download-artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist
        pattern: "nautilus_trader-*.whl"
        merge-multiple: true
        digest-mismatch: error
