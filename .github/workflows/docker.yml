name: docker

permissions: # Principle of least privilege
  contents: read
  actions: read

on:
  push:
    branches: [master, nightly]
  workflow_dispatch:

env:
  # SPDX in-toto predicate URI emitted by `actions/attest-sbom` for the SPDX 2.3
  # SBOMs produced by anchore/sbom-action (syft 1.42.x). Must exact-match
  # `--predicate-type` since cosign's `spdx` alias maps to the unversioned
  # `https://spdx.dev/Document` and would skip these attestations.
  SPDX_PREDICATE_TYPE: https://spdx.dev/Document/v2.3

jobs:
  build-docker-images-nautilus-trader:
    name: build-docker-images (nautilus_trader-${{ matrix.platform }})
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/nightly'
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: [self-hosted, Linux, X64, self-hosted-linux-x86]
          - platform: linux/arm64
            runner: depot-ubuntu-22.04-arm-8
    env:
      BUILD_MODE: release
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          # Docker Buildx still pulls its Moby BuildKit image from Docker Hub.
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            public.ecr.aws:443
            ghcr.io:443
            deb.debian.org:443
            security.debian.org:443
            static.rust-lang.org:443
            pypi.org:443
            files.pythonhosted.org:443
            crates.io:443
            static.crates.io:443

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Free disk space (Ubuntu)
        if: >-
          !startsWith(runner.name, 'nautilus-ci-runner-')
        run: >-
          bash scripts/ci/free-disk-space.sh
          --large-packages --docker-images --tool-cache

      # Fat LTO runs the final cdylib link in one rustc process, beyond Cargo's job cap,
      # so ARM builds need explicit swap headroom.
      - name: Add swap space (Linux ARM)
        if: matrix.platform == 'linux/arm64'
        run: bash scripts/ci/configure-linux-swap.bash

      - name: Verify Docker toolchain pins
        run: bash scripts/ci/check-docker-toolchain-pins.bash

      - name: Pull BuildKit with retry
        run: bash scripts/ci/docker-pull-retry.sh moby/buildkit:buildx-stable-1

      - name: Set up Docker Buildx
        # https://github.com/docker/setup-buildx-action
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Preload Dockerfile images with retry
        run: >-
          bash scripts/ci/preload-buildx-base-image-retry.sh
          "${{ matrix.platform }}" --from-dockerfile .docker/nautilus_trader.dockerfile

      - name: Login to GHCR
        # https://github.com/docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get branch name
        id: branch-name
        run: |
          echo "current_branch=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"

      - name: Generate platform slug
        id: platform-slug
        run: |
          echo "slug=$(echo '${{ matrix.platform }}' | sed 's/\//-/g')" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker metadata
        id: meta
        # https://github.com/docker/metadata-action
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/nautilus_trader
          tags: |
            type=raw,value=nightly,enable=${{ steps.branch-name.outputs.current_branch == 'nightly' }}
            type=raw,value=latest,enable=${{ steps.branch-name.outputs.current_branch == 'master' }}

      - name: Build and push by digest
        id: build
        # https://github.com/docker/build-push-action
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .docker/nautilus_trader.dockerfile
          platforms: ${{ matrix.platform }}
          pull: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nautilus_trader-${{ steps.platform-slug.outputs.slug }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=nautilus_trader-${{ steps.platform-slug.outputs.slug }}
          # yamllint disable-line rule:line-length
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/nautilus_trader,push-by-digest=true, name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash scripts/ci/save-docker-digest.bash nautilus_trader "$DIGEST"

      - name: Upload digest
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-nautilus_trader-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/nautilus_trader/*
          if-no-files-found: error
          retention-days: 1

  merge-nautilus-trader:
    name: merge-nautilus_trader
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      attestations: write
    needs: build-docker-images-nautilus-trader
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      digest_hex: ${{ steps.push.outputs.digest_hex }}
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          # Docker Buildx still pulls its Moby BuildKit image from Docker Hub.
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}
            ghcr.io:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout repository
        # Required so local ./.github/actions composites resolve at runtime;
        # merge jobs only download digests otherwise.
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download digests
        # https://github.com/actions/download-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests/nautilus_trader
          pattern: digests-nautilus_trader-*
          merge-multiple: true

      - name: Set up Docker Buildx
        # https://github.com/docker/setup-buildx-action
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        # https://github.com/docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get branch name
        id: branch-name
        run: |
          echo "current_branch=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker metadata
        id: meta
        # https://github.com/docker/metadata-action
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/nautilus_trader
          tags: |
            type=raw,value=nightly,enable=${{ steps.branch-name.outputs.current_branch == 'nightly' }}
            type=raw,value=latest,enable=${{ steps.branch-name.outputs.current_branch == 'master' }}

      - name: Create manifest list and push
        id: push
        working-directory: /tmp/digests/nautilus_trader
        shell: bash
        run: >-
          bash "$GITHUB_WORKSPACE/scripts/ci/create-docker-manifest.bash"
          "ghcr.io/${{ github.repository_owner }}/nautilus_trader"

      - name: Inspect image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nautilus_trader@${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE"

      - name: Install cosign
        # https://github.com/sigstore/cosign-installer
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign image with cosign
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nautilus_trader@${{ steps.push.outputs.digest }}
        run: bash ./scripts/ci/cosign-sign-retry.bash "$IMAGE"

      - name: Generate SBOM
        uses: ./.github/actions/generate-sbom-retry
        with:
          image: ghcr.io/${{ github.repository_owner }}/nautilus_trader@${{ steps.push.outputs.digest }}
          output-file: sbom.spdx.json

      - name: Attest SBOM
        uses: ./.github/actions/attest-sbom-retry
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/nautilus_trader
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json

      - name: Verify image signature and SBOM attestation
        timeout-minutes: 15
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nautilus_trader@${{ steps.push.outputs.digest }}
          ATTESTATION_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          ATTESTATION_ISSUER: https://token.actions.githubusercontent.com
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./scripts/ci/verify-docker-image-attestations.bash "$IMAGE"

  build-docker-images-jupyterlab:
    name: build-docker-images (jupyterlab-${{ matrix.platform }})
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/nightly'
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
    needs: merge-nautilus-trader
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: [self-hosted, Linux, X64, self-hosted-linux-x86]
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    env:
      BUILD_MODE: release
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            public.ecr.aws:443
            ghcr.io:443
            deb.debian.org:443
            security.debian.org:443
            static.rust-lang.org:443
            pypi.org:443
            files.pythonhosted.org:443
            crates.io:443
            static.crates.io:443

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Free disk space (Ubuntu)
        if: >-
          !startsWith(runner.name, 'nautilus-ci-runner-')
        run: >-
          bash scripts/ci/free-disk-space.sh
          --large-packages --docker-images --tool-cache

      - name: Verify Docker toolchain pins
        run: bash scripts/ci/check-docker-toolchain-pins.bash

      - name: Pull BuildKit with retry
        run: bash scripts/ci/docker-pull-retry.sh moby/buildkit:buildx-stable-1

      - name: Set up Docker Buildx
        # https://github.com/docker/setup-buildx-action
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Preload JupyterLab base images with retry
        env:
          BASE_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/nautilus_trader
          BASE_IMAGE_DIGEST: ${{ needs.merge-nautilus-trader.outputs.digest_hex }}
        run: >-
          bash scripts/ci/preload-buildx-base-image-retry.sh
          "${{ matrix.platform }}" --image
          "${BASE_IMAGE_REPOSITORY}@sha256:${BASE_IMAGE_DIGEST}"

      - name: Preload JupyterLab copy images with retry
        run: >-
          bash scripts/ci/preload-buildx-base-image-retry.sh
          "${{ matrix.platform }}" --from-dockerfile .docker/jupyterlab.dockerfile

      - name: Login to GHCR
        # https://github.com/docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get branch name
        id: branch-name
        run: |
          echo "current_branch=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"

      - name: Generate platform slug
        id: platform-slug
        run: |
          echo "slug=$(echo '${{ matrix.platform }}' | sed 's/\//-/g')" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker metadata
        id: meta
        # https://github.com/docker/metadata-action
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/jupyterlab
          tags: |
            type=raw,value=nightly,enable=${{ steps.branch-name.outputs.current_branch == 'nightly' }}
            type=raw,value=latest,enable=${{ steps.branch-name.outputs.current_branch == 'master' }}

      - name: Build and push by digest
        id: build
        # https://github.com/docker/build-push-action
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .docker/jupyterlab.dockerfile
          platforms: ${{ matrix.platform }}
          pull: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=jupyterlab-${{ steps.platform-slug.outputs.slug }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=jupyterlab-${{ steps.platform-slug.outputs.slug }}
          # yamllint disable-line rule:line-length
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/jupyterlab,push-by-digest=true, name-canonical=true,push=true
          build-args: |
            BASE_IMAGE_REPOSITORY=ghcr.io/${{ github.repository_owner }}/nautilus_trader
            BASE_IMAGE_DIGEST=${{ needs.merge-nautilus-trader.outputs.digest_hex }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash scripts/ci/save-docker-digest.bash jupyterlab "$DIGEST"

      - name: Upload digest
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-jupyterlab-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/jupyterlab/*
          if-no-files-found: error
          retention-days: 1

  merge-jupyterlab:
    name: merge-jupyterlab
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      attestations: write
    needs: build-docker-images-jupyterlab
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}
            ghcr.io:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout repository
        # Required so local ./.github/actions composites resolve at runtime;
        # merge jobs only download digests otherwise.
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download digests
        # https://github.com/actions/download-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests/jupyterlab
          pattern: digests-jupyterlab-*
          merge-multiple: true

      - name: Set up Docker Buildx
        # https://github.com/docker/setup-buildx-action
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        # https://github.com/docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get branch name
        id: branch-name
        run: |
          echo "current_branch=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker metadata
        id: meta
        # https://github.com/docker/metadata-action
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/jupyterlab
          tags: |
            type=raw,value=nightly,enable=${{ steps.branch-name.outputs.current_branch == 'nightly' }}
            type=raw,value=latest,enable=${{ steps.branch-name.outputs.current_branch == 'master' }}

      - name: Create manifest list and push
        id: push
        working-directory: /tmp/digests/jupyterlab
        shell: bash
        run: >-
          bash "$GITHUB_WORKSPACE/scripts/ci/create-docker-manifest.bash"
          "ghcr.io/${{ github.repository_owner }}/jupyterlab"

      - name: Inspect image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/jupyterlab@${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE"

      - name: Install cosign
        # https://github.com/sigstore/cosign-installer
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign image with cosign
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/jupyterlab@${{ steps.push.outputs.digest }}
        run: bash ./scripts/ci/cosign-sign-retry.bash "$IMAGE"

      - name: Generate SBOM
        uses: ./.github/actions/generate-sbom-retry
        with:
          image: ghcr.io/${{ github.repository_owner }}/jupyterlab@${{ steps.push.outputs.digest }}
          output-file: sbom.spdx.json

      - name: Attest SBOM
        uses: ./.github/actions/attest-sbom-retry
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/jupyterlab
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json

      - name: Verify image signature and SBOM attestation
        timeout-minutes: 15
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/jupyterlab@${{ steps.push.outputs.digest }}
          ATTESTATION_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          ATTESTATION_ISSUER: https://token.actions.githubusercontent.com
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./scripts/ci/verify-docker-image-attestations.bash "$IMAGE"
