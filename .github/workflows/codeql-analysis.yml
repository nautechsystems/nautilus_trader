name: codeql-analysis

permissions: # Principle of least privilege
  contents: read
  actions: read
  security-events: write # Required for CodeQL to upload SARIF

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [nightly]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "rust"]
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust linker (lld)
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y lld -o Acquire::Retries=5

      - name: Get Rust toolchain version
        if: matrix.language == 'rust'
        id: rust-toolchain
        run: |
          TOOLCHAIN="$(bash scripts/rust-toolchain.sh)"
          printf 'toolchain=%s\n' "$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Set up Rust toolchain
        if: matrix.language == 'rust'
        # https://github.com/actions-rust-lang/setup-rust-toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
          override: true

      - name: Initialize CodeQL
        # https://github.com/github/codeql-action
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.
          # queries: ./path/to/local/query, your-org/your-repo/queries@main

      - name: Autobuild
        if: matrix.language == 'rust'
        # https://github.com/github/codeql-action
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

      - name: Perform CodeQL Analysis
        # https://github.com/github/codeql-action
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
