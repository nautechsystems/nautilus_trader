name: security-audit

# Supply chain security checks.
#
# Triggers:
#   - Nightly cron and manual dispatch: every audit job runs unconditionally.
#   - Pull requests: GitHub path filters create a workflow run only when
#     audit-relevant paths change. The gate job remains as a second check
#     before the audit jobs run.
#   - Pushes to develop / master / test-ci / test-security: GitHub path filters
#     create a workflow run only when audit-relevant paths change. Do not broaden
#     this filter to every develop push. Development wheel publication waits for
#     and forces all audit jobs only within that path-scoped run.

permissions:
  contents: read
  actions: read

env:
  # Fork PRs lack repo/org vars, so audit instead of block.
  EGRESS_POLICY: >-
    ${{ github.event.pull_request.head.repo.fork && 'audit'
    || vars.STEP_SECURITY_EGRESS_POLICY
    || 'block' }}

on:
  pull_request:
    paths: &security_audit_paths
      - Cargo.lock # Keep in sync with scripts/ci/security-audit-gate.sh.
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/fuzz/Cargo.lock
      - .pre-commit-config.yaml
      - python/uv.lock
      - python/pyproject.toml
      - deny.toml
      - .cargo/deny-fuzz.toml
      - osv-scanner.toml
      - .supply-chain/**
      - tools.toml
      - .cargo/config.toml
      - .cargo/audit.toml
      - rust-toolchain.toml
      - scripts/cargo-tool-version.sh
      - scripts/purge-orphan-dev-wheels.sh
      - scripts/rust-toolchain.sh
      - scripts/uv-version.sh
      - scripts/ci/check-security-audit-result.sh
      - scripts/ci/check-security-gate-result.bash
      - scripts/ci/plan-wheel-publication.bash
      - scripts/ci/publish-wheels*
      - scripts/ci/security-audit-gate.sh
      - scripts/ci/test-publish-wheels.bash
      - scripts/ci/update-pyproject-version.sh
      - scripts/ci/validate-wheel-artifacts.bash
      - .github/actions/**
      - .github/workflows/**
  push:
    branches: [develop, master, test-ci, test-security]
    paths: *security_audit_paths
  schedule:
    - cron: "0 12 * * *" # Daily at 12:00 UTC (2hrs prior to nightly-merge)
  workflow_dispatch: # Allow manual trigger

# The six audit job names and their "Run ..." step names are checked by
# scripts/ci/check-security-audit-result.sh. Keep both files in sync.
jobs:
  changes:
    name: changes
    runs-on: ubuntu-22.04
    outputs:
      audit_needed: ${{ steps.filter.outputs.audit_needed }}
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ env.EGRESS_POLICY }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect audit-relevant changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          mode="$(bash scripts/ci/publish-wheels-policy.bash "$EVENT_NAME" "$GITHUB_REF_NAME")"
          if [ "$mode" = "development" ]; then
            export FORCE_SECURITY_AUDIT=true
          fi
          bash scripts/ci/security-audit-gate.sh

  zizmor:
    name: zizmor
    needs: changes
    if: needs.changes.outputs.audit_needed == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ env.EGRESS_POLICY }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.SECURITY_AUDIT_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Get uv version from pyproject.toml
        id: uv-version
        run: echo "uv_version=$(bash scripts/uv-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        # https://github.com/astral-sh/setup-uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ steps.uv-version.outputs.uv_version }}
          enable-cache: true

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --no-project --with zizmor==1.29.0 -- \
            zizmor --strict-collection --format sarif --min-severity informational .github/ \
            > zizmor.sarif

      - name: Upload zizmor SARIF
        if: >-
          always() &&
          hashFiles('zizmor.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          !github.event.pull_request.head.repo.fork)
        # https://github.com/github/codeql-action
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  cargo-audit:
    name: cargo-audit
    needs: changes
    if: needs.changes.outputs.audit_needed == 'true'
    runs-on: ubuntu-22.04
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ env.EGRESS_POLICY }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.SECURITY_AUDIT_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: ./.github/actions/cargo-tool-install
        with:
          tool-name: cargo-audit

      - name: Run cargo-audit
        run: |
          status=0
          cargo audit || status=$?
          cargo audit --file crates/adapters/lighter/fuzz/pornin/Cargo.lock || status=$?
          exit "$status"

  cargo-deny:
    name: cargo-deny
    needs: changes
    if: needs.changes.outputs.audit_needed == 'true'
    runs-on: ubuntu-22.04
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ env.EGRESS_POLICY }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.SECURITY_AUDIT_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: ./.github/actions/cargo-tool-install
        with:
          tool-name: cargo-deny

      - name: Run cargo-deny (advisories, licenses, sources, bans)
        run: |
          status=0
          cargo deny --all-features check advisories licenses sources bans || status=$?
          cargo deny --manifest-path crates/adapters/lighter/fuzz/pornin/Cargo.toml \
            --config .cargo/deny-fuzz.toml --locked --all-features check \
            advisories licenses sources bans || status=$?
          exit "$status"

  cargo-vet:
    name: cargo-vet
    needs: changes
    if: needs.changes.outputs.audit_needed == 'true'
    runs-on: ubuntu-22.04
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ env.EGRESS_POLICY }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.SECURITY_AUDIT_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install cargo-vet
        uses: ./.github/actions/cargo-tool-install
        with:
          tool-name: cargo-vet

      - name: Run cargo-vet
        run: |
          status=0
          cargo vet --locked || status=$?
          cargo vet --locked --manifest-path crates/adapters/lighter/fuzz/pornin/Cargo.toml \
            --store-path .supply-chain || status=$?
          exit "$status"

  pip-audit:
    name: pip-audit
    needs: changes
    if: needs.changes.outputs.audit_needed == 'true'
    runs-on: ubuntu-22.04
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ env.EGRESS_POLICY }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.SECURITY_AUDIT_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Get uv version from pyproject.toml
        shell: bash
        run: | # zizmor: ignore[github-env] Version comes from repository project metadata
          echo "UV_VERSION=$(bash scripts/uv-version.sh)" >> "$GITHUB_ENV"

      - name: Install uv
        # https://github.com/astral-sh/setup-uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Python
        run: uv python install 3.13

      - name: Run pip-audit
        run: >
          uv export --project python --all-groups --all-extras --frozen |
          sed '/^-e /d' |
          uv run --no-project --no-build --with "pip-audit==$(bash scripts/tool-version.sh pip-audit)" --
          pip-audit --disable-pip --require-hashes -r /dev/stdin

  osv-scanner:
    name: osv-scanner
    needs: changes
    if: needs.changes.outputs.audit_needed == 'true'
    runs-on: ubuntu-22.04
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ env.EGRESS_POLICY }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.SECURITY_AUDIT_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run osv-scanner
        # https://github.com/google/osv-scanner-action
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=Cargo.lock
            --lockfile=crates/adapters/lighter/fuzz/pornin/Cargo.lock
            --lockfile=python/uv.lock

  audit-result:
    name: audit-result
    if: always()
    needs:
      - changes
      - zizmor
      - cargo-audit
      - cargo-deny
      - cargo-vet
      - pip-audit
      - osv-scanner
    runs-on: ubuntu-22.04
    env:
      AUDIT_NEEDED: ${{ needs.changes.outputs.audit_needed }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      ZIZMOR_RESULT: ${{ needs.zizmor.result }}
      CARGO_AUDIT_RESULT: ${{ needs.cargo-audit.result }}
      CARGO_DENY_RESULT: ${{ needs.cargo-deny.result }}
      CARGO_VET_RESULT: ${{ needs.cargo-vet.result }}
      PIP_AUDIT_RESULT: ${{ needs.pip-audit.result }}
      OSV_SCANNER_RESULT: ${{ needs.osv-scanner.result }}
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: ${{ env.EGRESS_POLICY }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}

      - name: Require the planned audit result
        shell: bash
        run: |-
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Security audit planning did not succeed"
            exit 1
          fi

          if [ "$AUDIT_NEEDED" = "true" ]; then
            expected=success
          elif [ "$AUDIT_NEEDED" = "false" ]; then
            expected=skipped
          else
            echo "::error::Security audit planning produced no decision"
            exit 1
          fi

          for result in \
            "$ZIZMOR_RESULT" \
            "$CARGO_AUDIT_RESULT" \
            "$CARGO_DENY_RESULT" \
            "$CARGO_VET_RESULT" \
            "$PIP_AUDIT_RESULT" \
            "$OSV_SCANNER_RESULT"; do
            if [ "$result" != "$expected" ]; then
              echo "::error::Expected audit job result $expected, found $result"
              exit 1
            fi
          done
