name: nightly-tests

# Extended test suites that are slow, large, or require special features for PR builds.

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [test-nightly-tests]
  schedule:
    - cron: "0 12 * * *" # Daily at 12:00 UTC (same as security, 2hrs prior to nightly-merge)
  workflow_dispatch: # Allow manual trigger

jobs:
  cbindgen-abi:
    name: cbindgen C ABI
    runs-on: ubuntu-latest
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cbindgen
        uses: $/.github/actions/cargo-tool-install
        with:
          tool-name: cbindgen

      - name: Check generated C ABI
        run: make check-cbindgen-abi

  # Runs Miri across the foundational `nautilus-core` and `nautilus-model` crates,
  # plus the `nautilus-plugin` ABI boundary. This detects undefined behavior in
  # unsafe code (raw pointer / `CStr` handling in `string::stack_str`, plug-in FFI
  # ownership paths, aliasing rules) and confirms that the type-safe domain model
  # holds up against Miri's strict provenance and Stacked Borrows checks.
  miri:
    name: miri (${{ matrix.crate }})
    runs-on: [self-hosted, Linux, X64, self-hosted-linux-x86]
    strategy:
      fail-fast: false
      matrix:
        crate:
          - core
          - model
          - plugin
    env:
      # Dedicated target directory: Miri rebuilds against a different sysroot,
      # so sharing a target dir with stable jobs only churns the cache.
      CARGO_TARGET_DIR: /home/runner/.cache/cargo-target/miri-${{ matrix.crate }}
      RUST_BACKTRACE: 1
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Miri toolchain
        run: echo "MIRI_TOOLCHAIN=$(bash scripts/tool-version.sh miri)" >> "$GITHUB_ENV"

      - name: Common setup
        uses: $/.github/actions/common-setup
        with:
          python-version: "3.13"
          # free-disk-space auto-skips on the nautilus-ci-runner-* pool.
          free-disk-space: "true"
          # Persistent CARGO_TARGET_DIR replaces Swatinem/rust-cache here.
          rust-cache-enabled: "false"

      - name: Install nightly toolchain with miri
        run: |
          rustup toolchain install "${MIRI_TOOLCHAIN}" --component miri --profile minimal
          rustup +"${MIRI_TOOLCHAIN}" component add rust-src

      - name: Verify Miri toolchain compatibility
        run: bash scripts/ci/check-miri-toolchain.bash --verify-installed

      - name: Setup miri sysroot
        run: cargo +"${MIRI_TOOLCHAIN}" miri setup

      - name: Run Miri
        run: make cargo-miri-${{ matrix.crate }} MIRI_TOOLCHAIN="${MIRI_TOOLCHAIN}"

  standard-precision:
    name: standard precision clippy
    # Standard precision remains a supported Rust feature configuration,
    # but Clippy does not see it on PRs, so lints that fire only when the raw
    # types are u64/i64 can reach develop unnoticed.
    runs-on: [self-hosted, Linux, X64, self-hosted-linux-x86]
    env:
      # Outside the workspace so it survives actions/checkout's git clean -ffdx,
      # giving us persistent on-disk Rust artifact reuse between runs.
      CARGO_TARGET_DIR: /home/runner/.cache/cargo-target/standard-precision
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Common setup
        uses: $/.github/actions/common-setup
        with:
          python-version: "3.13"
          # free-disk-space auto-skips on the nautilus-ci-runner-* pool.
          free-disk-space: "true"
          # Persistent CARGO_TARGET_DIR replaces Swatinem/rust-cache here.
          rust-cache-enabled: "false"

      - name: Run clippy with standard precision
        run: make check-code-standard-precision

  rust-doctests:
    name: Rust doctests (Python ${{ matrix.python-version }})
    runs-on: [self-hosted, Linux, X64, self-hosted-linux-x86]
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"
    env:
      CARGO_BUILD_JOBS: 16
      CARGO_CI_PROFILE: nextest
      CARGO_TARGET_DIR: /home/runner/.cache/cargo-target/rust-doctests-py${{ matrix.python-version }}
      NEXTEST_TEST_THREADS: 16
      RUST_BACKTRACE: 1
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Common setup
        uses: $/.github/actions/common-setup
        with:
          python-version: ${{ matrix.python-version }}
          # free-disk-space auto-skips on the nautilus-ci-runner-* pool.
          free-disk-space: "true"
          # Persistent CARGO_TARGET_DIR replaces Swatinem/rust-cache here.
          rust-cache-enabled: "false"

      - name: Run Rust doctests
        run: >-
          make cargo-test-doc
          EXTRA_FEATURES="capnp,hypersync,nautilus-serialization/sbe,nautilus-infrastructure/postgres"

  python-memray:
    name: Python memory leak tests
    runs-on: [self-hosted, Linux, X64, self-hosted-linux-x86]
    env:
      # Outside the workspace so it survives actions/checkout's git clean -ffdx,
      # giving us persistent on-disk Rust artifact reuse between runs.
      TARGET_DIR: /home/runner/.cache/cargo-target/python-memray
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Common setup
        uses: $/.github/actions/common-setup
        with:
          python-version: "3.14"
          # free-disk-space auto-skips on the nautilus-ci-runner-* pool.
          free-disk-space: "true"
          # Persistent CARGO_TARGET_DIR replaces Swatinem/rust-cache here.
          rust-cache-enabled: "false"

      - name: Sync Python dependencies
        run: make sync

      - name: Run Python memory leak tests
        run: make pytest-memray

  turmoil:
    name: turmoil network tests
    runs-on: [self-hosted, Linux, X64, self-hosted-linux-x86]
    env:
      # Outside the workspace so it survives actions/checkout's git clean -ffdx,
      # giving us persistent on-disk Rust artifact reuse between runs.
      CARGO_TARGET_DIR: /home/runner/.cache/cargo-target/turmoil
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Common setup
        uses: $/.github/actions/common-setup
        with:
          python-version: "3.13"
          # free-disk-space auto-skips on the nautilus-ci-runner-* pool.
          free-disk-space: "true"
          # Persistent CARGO_TARGET_DIR replaces Swatinem/rust-cache here.
          rust-cache-enabled: "false"

      - name: Run turmoil network tests (tungstenite)
        env:
          RUST_BACKTRACE: 1
        run: cargo nextest run -p nautilus-network --features turmoil --cargo-profile nextest --status-level fail

      - name: Run turmoil network tests (sockudo)
        env:
          RUST_BACKTRACE: 1
        run: |
          cargo nextest run -p nautilus-network \
            --features "turmoil,transport-sockudo" \
            --test integration \
            -E 'test(/^turmoil_sockudo::/)' \
            --cargo-profile nextest --status-level fail

  cargo-publish-plan:
    name: cargo publish plan
    runs-on: ubuntu-latest
    needs:
      - turmoil
    if: ${{ !cancelled() }}
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}
            crates.io:443
            index.crates.io:443
            static.crates.io:443

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Common setup
        uses: $/.github/actions/common-setup
        with:
          python-version: "3.13"
          build-type: "test"
          free-disk-space: "true"
          uv-cache-enabled: "false"
          prek-cache-enabled: "false"
          capnp-cache-enabled: "false"
          rust-cache-enabled: "false"
          rust-cache-save-if: "false"

      - name: Check Cargo crate publish plan
        run: bash scripts/ci/publish-cargo-crates.sh --check

      - name: Dry-run Cargo crate publishing
        run: bash scripts/ci/publish-cargo-crates.sh --dry-run

  docsrs-check:
    name: docsrs-check
    runs-on: [self-hosted, Linux, X64, self-hosted-linux-x86]
    env:
      # Outside the workspace so it survives actions/checkout's git clean -ffdx,
      # giving us persistent on-disk Rust artifact reuse between runs.
      CARGO_TARGET_DIR: /home/runner/.cache/cargo-target/docsrs-check
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Common setup
        uses: $/.github/actions/common-setup
        with:
          python-version: "3.13"
          # free-disk-space auto-skips on the nautilus-ci-runner-* pool.
          free-disk-space: "true"
          # Persistent CARGO_TARGET_DIR replaces Swatinem/rust-cache here.
          rust-cache-enabled: "false"

      - name: Install pinned Rust nightly
        run: rustup toolchain install "$(bash scripts/tool-version.sh nightly)" --profile minimal

      - name: Install cargo-hack
        # https://github.com/taiki-e/install-action
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-hack

      - name: Run docsrs-check
        run: make docsrs-check

  check-features:
    name: check-features
    runs-on: [self-hosted, Linux, X64, self-hosted-linux-x86]
    env:
      # Outside the workspace so it survives actions/checkout's git clean -ffdx,
      # giving us persistent on-disk Rust artifact reuse between runs.
      CARGO_TARGET_DIR: /home/runner/.cache/cargo-target/check-features
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Common setup
        uses: $/.github/actions/common-setup
        with:
          python-version: "3.13"
          # free-disk-space auto-skips on the nautilus-ci-runner-* pool.
          free-disk-space: "true"
          # Persistent CARGO_TARGET_DIR replaces Swatinem/rust-cache here.
          rust-cache-enabled: "false"

      - name: Install cargo-hack
        # https://github.com/taiki-e/install-action
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-hack

      - name: Run check-features
        run: make check-features

  check-all-targets:
    name: check-all-targets
    runs-on: [self-hosted, Linux, X64, self-hosted-linux-x86]
    env:
      # Outside the workspace so it survives actions/checkout's git clean -ffdx,
      # giving us persistent on-disk Rust artifact reuse between runs.
      CARGO_TARGET_DIR: /home/runner/.cache/cargo-target/check-all-targets
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Common setup
        uses: $/.github/actions/common-setup
        with:
          python-version: "3.13"
          # free-disk-space auto-skips on the nautilus-ci-runner-* pool.
          free-disk-space: "true"
          # Persistent CARGO_TARGET_DIR replaces Swatinem/rust-cache here.
          rust-cache-enabled: "false"

      - name: Run check-all-targets
        run: make check-all-targets
