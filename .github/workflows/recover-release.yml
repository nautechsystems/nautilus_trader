name: recover-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      source-run:
        description: Original completed master build run ID
        required: true
        type: string
      publication-run:
        description: Successful build.yml publication recovery run, if needed
        required: false
        type: string
      mode:
        description: Recover a draft or verify a published release
        required: true
        default: verify
        type: choice
        options: [verify, recover]

permissions:
  contents: read
  actions: read

jobs:
  recover:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      attestations: read
      contents: write
    concurrency:
      group: release-publication-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}
            pypi.org:443
            files.pythonhosted.org:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443

      - name: Prepare verifier diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/release-recovery"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/release-recovery/cache" >> "$GITHUB_ENV"

      - name: Checkout recovery implementation
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: recovery
          persist-credentials: false

      - name: Checkout release source
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      # https://github.com/actions/setup-python
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Resolve verification tool versions
        run: |
          echo "UV_VERSION=$(bash recovery/scripts/uv-version.sh)" >> "$GITHUB_ENV"
          echo "PYPI_ATTESTATIONS_VERSION=$(bash recovery/scripts/tool-version.sh pypi-attestations)" >> "$GITHUB_ENV"

      # https://github.com/astral-sh/setup-uv
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Recover or verify release
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag }}
          SOURCE_RUN_ID: ${{ inputs.source-run }}
          PYPI_RECOVERY_RUN_ID: ${{ inputs.publication-run }}
          RECOVERY_MODE: ${{ inputs.mode }}
          CRATES_IO_MANUAL_PUBLISH_EXCEPTIONS: ${{ vars.CRATES_IO_MANUAL_PUBLISH_EXCEPTIONS }}
        run: >-
          bash ../recovery/scripts/ci/recover-release.bash
          "$TAG_NAME" "$SOURCE_RUN_ID" "$RECOVERY_MODE"
          "${{ runner.temp }}/release-recovery"

      - name: Retain recovery diagnostics
        if: always()
        continue-on-error: true
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-recovery
            !${{ runner.temp }}/release-recovery/**/*.whl
            !${{ runner.temp }}/release-recovery/**/*.tar.gz
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
