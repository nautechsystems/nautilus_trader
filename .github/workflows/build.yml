name: build

# Build and publish the Python package, Rust crates, and stable release assets

permissions:
  # Principle of least privilege
  contents: read
  actions: read

on:
  push:
    branches:
      - test-ci
      - test-pre-commit
      - develop
      - nightly
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - develop

concurrency:
  group: >-
    ${{ format('{0}-{1}', github.workflow,
    github.event.pull_request.number || format('{0}-{1}', github.ref_name, github.sha)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AUDIT_PR: >-
    ${{ github.event_name == 'pull_request'
    && (!github.event.pull_request.head.repo.full_name
    || github.event.pull_request.head.repo.full_name != github.repository) }}
  UNTRUSTED_PR: >-
    ${{ github.event_name == 'pull_request'
    && (!github.event.pull_request.head.repo.full_name
    || github.event.pull_request.head.repo.full_name != github.repository
    || !github.event.pull_request.user.login
    || github.event.pull_request.user.login == 'dependabot[bot]') }}
  PACKAGE_DIR: python

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.plan.outputs.run_tests }}
      run-rust-tests: ${{ steps.plan.outputs.run_rust_tests }}
      github-changed: ${{ steps.plan.outputs.github_changed }}
      untrusted_pr: ${{ steps.policy.outputs.untrusted_pr }}
      publish_r2: ${{ steps.wheel-publication.outputs.publish_r2 }}
      publish_development: ${{ steps.wheel-publication.outputs.publish_development }}
      publish_environment: ${{ steps.wheel-publication.outputs.publish_environment }}
      wheel_matrix: ${{ steps.wheel-publication.outputs.wheel_matrix }}
      wheel_version: ${{ steps.wheel-publication.outputs.wheel_version }}
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: >-
            ${{ env.AUDIT_PR == 'true' && 'audit'
            || vars.STEP_SECURITY_EGRESS_POLICY
            || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Export CI policy
        id: policy
        run: echo "untrusted_pr=${UNTRUSTED_PR}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/ci/plan.sh

      - name: Plan wheel publication
        id: wheel-publication
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: bash scripts/ci/plan-wheel-publication.bash

  security-audit:
    name: security audit
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security-audit.yml
    with:
      force: >-
        ${{
        github.event_name == 'push' &&
        (github.ref == 'refs/heads/test-ci' ||
        github.ref == 'refs/heads/test-pre-commit')
        }}
      skip: ${{ github.ref == 'refs/heads/nightly' }}

  test-scripts:
    name: script tests
    needs: plan
    # Match pre-commit so script tests validate its execution environment.
    runs-on: >-
      ${{ github.event_name == 'pull_request'
      && needs.plan.outputs.untrusted_pr != 'false'
      && 'ubuntu-22.04'
      || fromJson('["self-hosted", "Linux", "X64", "build"]') }}
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: >-
            ${{ env.AUDIT_PR == 'true' && 'audit'
            || vars.STEP_SECURITY_EGRESS_POLICY
            || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python environment
        # https://github.com/actions/setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install ripgrep
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y ripgrep -o Acquire::Retries=5

      - name: Check GitHub Action pins
        # One network round trip per pinned reference, so only when they changed
        if: needs.plan.outputs.github-changed == 'true'
        run: make check-github-action-pins

      - name: Check Docker toolchain pins
        run: make check-docker-toolchain-pins

      - name: Get Rust toolchain version
        run: echo "TOOLCHAIN=$(bash scripts/rust-toolchain.sh)" >> "$GITHUB_ENV"

      - name: Set up Rust toolchain
        # https://github.com/actions-rust-lang/setup-rust-toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ env.TOOLCHAIN }}
          cache: false
          override: true

      - name: Check jiff features
        run: make check-jiff-features

      - name: Run script tests
        run: make test-scripts

  pre-commit:
    name: pre-commit
    needs:
      - plan
      - test-scripts
    # Untrusted PRs stay on GitHub-hosted runners
    runs-on: >-
      ${{ github.event_name == 'pull_request'
      && needs.plan.outputs.untrusted_pr != 'false'
      && 'ubuntu-22.04'
      || fromJson('["self-hosted", "Linux", "X64", "build"]') }}
    env:
      # Self-hosted keeps Rust artifacts outside the workspace
      CARGO_TARGET_DIR: >-
        ${{ github.event_name == 'pull_request'
        && needs.plan.outputs.untrusted_pr != 'false'
        && format('{0}/target', github.workspace)
        || '/home/runner/.cache/cargo-target/pre-commit' }}
      CARGO_CI_PROFILE: >-
        ${{ github.event_name == 'pull_request'
        && needs.plan.outputs.untrusted_pr != 'false'
        && 'ci-pr'
        || 'nextest' }}
      # Scopes changed-package Rust checks; empty for non-PR/push events.
      CHANGED_BASE_SHA: >-
        ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: >-
            ${{ env.AUDIT_PR == 'true' && 'audit'
            || vars.STEP_SECURITY_EGRESS_POLICY
            || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so changed-file scripts can resolve CHANGED_BASE_SHA.
          fetch-depth: 0

      - name: Verify immutable CI inputs (post-checkout)
        run: bash scripts/ci/verify-ci-inputs.sh post-checkout

      - name: Common setup
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          # free-disk-space auto-skips on the nautilus-ci-runner-* pool.
          free-disk-space: "true"
          build-type: "pre-commit"
          rust-cache-enabled: "false"

      - name: Limit Cargo build jobs on GitHub-hosted runners
        if: runner.environment == 'github-hosted'
        run: echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"

      - name: Get lychee version
        run: |
          version="$(bash scripts/cargo-tool-version.sh lychee)"
          echo "LYCHEE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install lychee
        # https://github.com/taiki-e/install-action
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: lychee@${{ env.LYCHEE_VERSION }}
        env:
          # Ubuntu 22.04 glibc is older than Lychee's GNU binary requires
          CARGO_BUILD_TARGET: x86_64-unknown-linux-musl

      - name: Get cargo-machete version
        run: |
          version="$(bash scripts/cargo-tool-version.sh cargo-machete)"
          echo "CARGO_MACHETE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install cargo-machete
        # https://github.com/taiki-e/install-action
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-machete@${{ env.CARGO_MACHETE_VERSION }}

      - name: Run pre-commit
        run: prek run --all-files

      - name: Verify capnp schemas are up-to-date
        run: make check-capnp-schemas

  build:
    if: github.ref != 'refs/heads/test-pre-commit' && needs.plan.outputs.run-tests == 'true'
    needs:
      - plan
      - pre-commit
      - test-scripts
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    name: build - python ${{ matrix.python-version }} (ubuntu-22.04)
    runs-on: >-
      ${{ github.event_name == 'pull_request'
      && needs.plan.outputs.untrusted_pr != 'false'
      && 'ubuntu-22.04'
      || fromJson('["self-hosted", "Linux", "X64", "build"]') }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_CI_PROFILE: >-
        ${{ github.event_name == 'pull_request'
        && needs.plan.outputs.untrusted_pr != 'false'
        && 'ci-pr'
        || 'nextest' }}
      MATURIN_PROFILE: >-
        ${{ github.event_name == 'pull_request'
        && needs.plan.outputs.untrusted_pr != 'false'
        && 'ci-pr-wheel'
        || 'release' }}
      NAUTILUS_TEST_INFRASTRUCTURE: "1"
      RUST_BACKTRACE: 1
      # Self-hosted keeps Rust artifacts outside the workspace
      CARGO_TARGET_DIR: >-
        ${{ github.event_name == 'pull_request'
        && needs.plan.outputs.untrusted_pr != 'false'
        && format('{0}/target', github.workspace)
        || format('/home/runner/.cache/cargo-target/py{0}', matrix.python-version) }}
    # yamllint disable rule:line-length
    services:
      redis:
        image: public.ecr.aws/docker/library/redis:7.4.5-alpine3.21@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: public.ecr.aws/docker/library/postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: nautilus
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d nautilus" --health-interval 10s --health-timeout 5s --health-retries
          5
    # yamllint enable rule:line-length
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: >-
            ${{ env.AUDIT_PR == 'true' && 'audit'
            || vars.STEP_SECURITY_EGRESS_POLICY
            || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify immutable CI inputs (post-checkout)
        run: bash scripts/ci/verify-ci-inputs.sh post-checkout

      - name: Common setup
        uses: ./.github/actions/common-setup
        with:
          python-version: ${{ matrix.python-version }}
          # free-disk-space auto-skips on the nautilus-ci-runner-* pool.
          free-disk-space: "true"
          free-disk-space-max-build: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}
          rust-cache-enabled: "false"

      - name: Limit Cargo build jobs on GitHub-hosted runners
        if: runner.environment == 'github-hosted'
        run: echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"

      - name: Install Nautilus CLI
        env:
          NAUTILUS_CLI_FORCE_SOURCE: "1"
        run: bash scripts/ci/install-nautilus-cli.sh

      - name: Init postgres schema
        run: nautilus database init --schema ${{ github.workspace }}/schema/sql
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USERNAME: postgres
          POSTGRES_PASSWORD: pass
          POSTGRES_DATABASE: nautilus

      - name: Update version in pyproject.toml
        if: ${{ github.ref != 'refs/heads/master' }}
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          PUBLISH_WHEEL_VERSION: ${{ needs.plan.outputs.wheel_version }}
        run: |
          bash ../scripts/ci/update-pyproject-version.sh

      - name: Verify immutable CI inputs (pre-wheel build)
        run: bash scripts/ci/verify-ci-inputs.sh pre-wheel-build

      - name: Build wheel
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          MATURIN_VERSION="$(bash ../scripts/maturin-version.bash)"
          uv run --no-project --no-build --with "maturin==${MATURIN_VERSION}" -- \
            maturin build --profile "$MATURIN_PROFILE" --out ../dist

      - name: Run Python tests
        working-directory: ${{ env.PACKAGE_DIR }}
        run: bash ../scripts/ci/test-wheel.bash

      - name: Check generated file drift
        # Keep this 3.13 condition in sync with the matrix so drift is checked once per run.
        if: matrix.python-version == '3.13'
        env:
          TARGET_DIR: >-
            ${{ github.event_name == 'pull_request'
            && needs.plan.outputs.untrusted_pr != 'false'
            && format('{0}/target/py-stubs', github.workspace)
            || '/home/runner/.cache/cargo-target/py-stubs' }}
        run: |
          make py-stubs
          bash scripts/ci/check-generated-drift.bash

      - name: Upload wheel artifact
        uses: ./.github/actions/upload-artifact-wheel
        with:
          retention-days: ${{ github.ref_name == 'master' && '7' || '1' }}

  rust-tests-linux-x86:
    if: >
      github.ref != 'refs/heads/test-pre-commit' &&
      needs.plan.outputs.run-tests == 'true' &&
      (needs.plan.outputs.run-rust-tests == 'true' ||
       needs.plan.outputs.publish_r2 == 'true' ||
       github.ref == 'refs/heads/master')
    name: rust tests (ubuntu-22.04)
    runs-on: >-
      ${{ github.event_name == 'pull_request'
      && needs.plan.outputs.untrusted_pr != 'false'
      && 'ubuntu-22.04'
      || fromJson('["self-hosted", "Linux", "X64", "build"]') }}
    needs:
      - plan
      - pre-commit
      - test-scripts
    env:
      CARGO_CI_PROFILE: >-
        ${{ github.event_name == 'pull_request'
        && needs.plan.outputs.untrusted_pr != 'false'
        && 'ci-pr'
        || github.event_name == 'push'
        && (github.ref_name == 'develop' || github.ref_name == 'test-ci')
        && 'ci-pr'
        || 'nextest' }}
      CARGO_TARGET_DIR: >-
        ${{ github.event_name == 'pull_request'
        && needs.plan.outputs.untrusted_pr != 'false'
        && 'target/rust-tests-linux-x86'
        || github.event_name == 'push'
        && (github.ref_name == 'develop' || github.ref_name == 'test-ci')
        && 'target/rust-tests-linux-x86'
        || '/home/runner/.cache/cargo-target/rust-tests-linux-x86' }}
      RUST_BACKTRACE: 1
    # yamllint disable rule:line-length
    services:
      redis:
        image: public.ecr.aws/docker/library/redis:7.4.5-alpine3.21@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: public.ecr.aws/docker/library/postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: nautilus
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d nautilus" --health-interval 10s --health-timeout 5s --health-retries
          5
    # yamllint enable rule:line-length
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: >-
            ${{ env.AUDIT_PR == 'true' && 'audit'
            || vars.STEP_SECURITY_EGRESS_POLICY
            || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify immutable CI inputs (post-checkout)
        run: bash scripts/ci/verify-ci-inputs.sh post-checkout

      - name: Common setup
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          free-disk-space: "true"
          free-disk-space-max-build: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}
          rust-cache-enabled: >-
            ${{ (runner.environment == 'github-hosted'
            || github.event_name == 'push'
            && (github.ref_name == 'develop' || github.ref_name == 'test-ci'))
            && 'true' || 'false' }}
          rust-cache-key: rust-tests-linux-x86
          rust-cache-workspaces: . -> target/rust-tests-linux-x86
          rust-cache-on-failure: "false"
          rust-cache-save-if: ${{ github.event_name == 'push' }}

      - name: Limit Cargo build jobs on GitHub-hosted runners
        if: runner.environment == 'github-hosted'
        run: echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"

      - name: Install Nautilus CLI
        env:
          NAUTILUS_CLI_FORCE_SOURCE: "1"
        run: bash scripts/ci/install-nautilus-cli.sh

      - name: Init postgres schema
        run: nautilus database init --schema ${{ github.workspace }}/schema/sql
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USERNAME: postgres
          POSTGRES_PASSWORD: pass
          POSTGRES_DATABASE: nautilus

      - name: Cached test data
        uses: ./.github/actions/common-test-data

      - name: Report disk space before Rust tests
        run: bash scripts/ci/report-disk-space.bash "before Rust tests"

      - name: Run Rust tests
        run: >-
          make cargo-test NEXTEST_PROFILE=ci
          EXTRA_FEATURES="capnp,hypersync,nautilus-serialization/sbe,nautilus-infrastructure/postgres"

      - name: Report disk space after Rust tests
        if: always()
        run: bash scripts/ci/report-disk-space.bash "after Rust tests"

  # Linux ARM64, macOS ARM64, and Windows x86_64 wheels build only on nightly and master
  build-linux-arm:
    if: >
      needs.plan.outputs.run-tests == 'true' &&
      (github.ref_name == 'nightly' || github.ref_name == 'master')
    needs:
      - plan
      - pre-commit
      - test-scripts
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: depot-ubuntu-22.04-arm-8
    defaults:
      run:
        shell: bash
    env:
      BUILD_MODE: release
      RUST_BACKTRACE: 1
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/build-linux-arm
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Common setup
        uses: ./.github/actions/common-setup
        with:
          python-version: ${{ matrix.python-version }}
          free-disk-space: "true"
          rust-cache-key: build-linux-arm
          rust-cache-workspaces: . -> target/build-linux-arm
          rust-cache-save-if: ${{ github.event_name == 'push' }}

      - name: Update version in pyproject.toml
        if: ${{ github.ref != 'refs/heads/master' }}
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          PUBLISH_WHEEL_VERSION: ${{ needs.plan.outputs.wheel_version }}
        run: bash ../scripts/ci/update-pyproject-version.sh

      - name: Build wheel
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          MATURIN_VERSION="$(bash ../scripts/maturin-version.bash)"
          uv run --no-project --no-build --with "maturin==${MATURIN_VERSION}" -- \
            maturin build --release --out ../dist

      - name: Run Python tests
        working-directory: ${{ env.PACKAGE_DIR }}
        run: bash ../scripts/ci/test-wheel.bash

      - name: Upload wheel artifact
        uses: ./.github/actions/upload-artifact-wheel
        with:
          retention-days: ${{ github.ref_name == 'master' && '7' || '1' }}

  build-macos:
    if: >
      needs.plan.outputs.run-tests == 'true' &&
      (github.ref_name == 'nightly' || github.ref_name == 'master')
    needs:
      - plan
      - pre-commit
      - test-scripts
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      BUILD_MODE: release
      RUST_BACKTRACE: 1
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/build-macos
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Common setup
        uses: ./.github/actions/common-setup
        with:
          python-version: ${{ matrix.python-version }}
          free-disk-space: "true"
          rust-cache-key: build-macos
          rust-cache-workspaces: . -> target/build-macos
          rust-cache-save-if: ${{ github.event_name == 'push' }}

      - name: Update version in pyproject.toml
        if: ${{ github.ref != 'refs/heads/master' }}
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          PUBLISH_WHEEL_VERSION: ${{ needs.plan.outputs.wheel_version }}
        run: bash ../scripts/ci/update-pyproject-version.sh

      - name: Build wheel
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          MATURIN_VERSION="$(bash ../scripts/maturin-version.bash)"
          uv run --no-project --no-build --with "maturin==${MATURIN_VERSION}" -- \
            maturin build --release --out ../dist

      - name: Run Python tests
        working-directory: ${{ env.PACKAGE_DIR }}
        run: bash ../scripts/ci/test-wheel.bash

      - name: Upload wheel artifact
        uses: ./.github/actions/upload-artifact-wheel
        with:
          retention-days: ${{ github.ref_name == 'master' && '7' || '1' }}

  build-windows:
    if: >
      needs.plan.outputs.run-tests == 'true' &&
      (github.ref_name == 'nightly' || github.ref_name == 'master')
    needs:
      - plan
      - pre-commit
      - test-scripts
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: depot-windows-2022-8
    defaults:
      run:
        shell: bash
    env:
      BUILD_MODE: release
      RUST_BACKTRACE: 1
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/build-windows
    steps:
      # Harden-Runner skips its agent on Depot Windows, and its post step assumes
      # C:\agent exists. Keep this job out until upstream fixes cleanup.

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Common setup
        uses: ./.github/actions/common-setup
        with:
          python-version: ${{ matrix.python-version }}
          free-disk-space: "true"
          rust-cache-key: build-windows
          rust-cache-workspaces: . -> target/build-windows
          rust-cache-save-if: ${{ github.event_name == 'push' }}

      - name: Update version in pyproject.toml
        if: ${{ github.ref != 'refs/heads/master' }}
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          PUBLISH_WHEEL_VERSION: ${{ needs.plan.outputs.wheel_version }}
        run: bash ../scripts/ci/update-pyproject-version.sh

      - name: Build wheel
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          MATURIN_VERSION="$(bash ../scripts/maturin-version.bash)"
          uv run --no-project --no-build --with "maturin==${MATURIN_VERSION}" -- \
            maturin build --release --out ../dist

      - name: Run Python tests
        working-directory: ${{ env.PACKAGE_DIR }}
        run: bash ../scripts/ci/test-wheel.bash

      - name: Upload wheel artifact
        uses: ./.github/actions/upload-artifact-wheel
        with:
          retention-days: ${{ github.ref_name == 'master' && '7' || '1' }}

  security-gate-nightly:
    name: security-gate-nightly
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.result.outputs.result }}
    needs:
      - build
      - build-linux-arm
      - build-macos
      - build-windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/nightly'
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.SECURITY_AUDIT_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: ./.github/actions/cargo-tool-install
        with:
          tool-name: cargo-audit

      - name: Run cargo-audit
        id: cargo-audit
        continue-on-error: true
        run: |
          status=0
          cargo audit --deny unsound || status=$?
          cargo audit --deny unsound --file crates/adapters/lighter/fuzz/pornin/Cargo.lock || status=$?
          exit "$status"

      - name: Run osv-scanner
        id: osv-scan
        continue-on-error: true
        # https://github.com/google/osv-scanner-action
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --format=json
            --output=/github/workspace/osv-results.json
            --lockfile=Cargo.lock
            --lockfile=crates/adapters/lighter/fuzz/pornin/Cargo.lock
            --lockfile=python/uv.lock

      - name: Check OSV severity
        id: osv-severity
        if: steps.osv-scan.outcome == 'failure'
        continue-on-error: true
        run: bash scripts/ci/osv-severity-gate.sh osv-results.json

      - name: Record security gate result
        id: result
        if: always()
        env:
          CARGO_AUDIT_OUTCOME: ${{ steps.cargo-audit.outcome }}
          OSV_SCAN_OUTCOME: ${{ steps.osv-scan.outcome }}
          OSV_SEVERITY_OUTCOME: ${{ steps.osv-severity.outcome }}
        run: |
          if [ "$CARGO_AUDIT_OUTCOME" = "success" ] &&
            { [ "$OSV_SCAN_OUTCOME" = "success" ] || [ "$OSV_SEVERITY_OUTCOME" = "success" ]; }; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs:
      - plan
      - build
      - build-linux-arm
      - build-macos
      - build-windows
      - rust-tests-linux-x86
      - security-audit
      - security-gate-nightly
    runs-on: ubuntu-latest
    # Publish dev/nightly wheels to the R2 index. The platform jobs are skipped on develop
    # (Linux x86_64 only there), so guard on results rather than success: require the Linux
    # build and tolerate skipped (but not failed) platform jobs. master uses the dedicated stable
    # release jobs instead, so it is intentionally excluded here.
    if: >
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.build-linux-arm.result != 'failure' &&
      needs.build-macos.result != 'failure' &&
      needs.build-windows.result != 'failure' &&
      needs.rust-tests-linux-x86.result == 'success' &&
      (needs.security-audit.result == 'success' ||
       (needs.plan.outputs.publish_development == 'true' &&
        needs.security-audit.result == 'failure')) &&
      github.event_name == 'push' &&
      needs.plan.outputs.publish_r2 == 'true' &&
      (needs.plan.outputs.wheel_matrix != 'nightly' ||
       needs.security-gate-nightly.result == 'success')
    environment: ${{ needs.plan.outputs.publish_environment }}
    permissions:
      actions: write # Required for deleting artifacts
      contents: read
      id-token: write # Required for attestations
      attestations: write # Required for attestations
    env:
      CLOUDFLARE_R2_REGION: "auto"
      CLOUDFLARE_R2_BUCKET_NAME: "packages"
      CLOUDFLARE_R2_PREFIX: "simple/nautilus-trader"
      PUBLISH_WHEELS_INDEX_URL: "https://packages.nautechsystems.io/simple"
      PUBLISH_WHEEL_MATRIX: ${{ needs.plan.outputs.wheel_matrix }}
      PUBLISH_WHEEL_VERSION: ${{ needs.plan.outputs.wheel_version }}
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}
            packages.nautechsystems.io:443
            tuf-repo-cdn.sigstore.dev:443
            ${{ secrets.CLOUDFLARE_R2_ALLOWED_HOST }}:443

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require successful nightly security gate
        if: needs.plan.outputs.wheel_matrix == 'nightly'
        env:
          SECURITY_GATE_OVERRIDE: ${{ vars.SECURITY_GATE_OVERRIDE }}
          SECURITY_GATE_RESULT: ${{ needs.security-gate-nightly.outputs.result }}
          SECURITY_GATE_SHA: ${{ github.sha }}
        run: bash scripts/ci/check-security-gate-result.bash

      - name: Require successful security audit
        if: needs.security-audit.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECURITY_AUDIT_RESULT: ${{ needs.security-audit.result }}
          SECURITY_GATE_OVERRIDE: ${{ vars.SECURITY_GATE_OVERRIDE }}
        run: bash scripts/ci/check-security-audit-result.sh

      - name: Set up Python
        # https://github.com/actions/setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Get uv version
        id: uv-version
        run: echo "uv_version=$(bash scripts/uv-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        # https://github.com/astral-sh/setup-uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ steps.uv-version.outputs.uv_version }}
          prune-cache: true

      - name: Download built wheels
        # https://github.com/actions/download-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "nautilus_trader-*.whl"
          merge-multiple: true

      # https://github.com/actions/attest-build-provenance
      - name: Attest wheel provenance
        uses: ./.github/actions/attest-build-provenance-retry
        with:
          subject-path: "dist/nautilus_trader-*.whl"

      - name: Verify wheel attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTESTATION_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          ATTESTATION_ISSUER: https://token.actions.githubusercontent.com
        run: bash ./scripts/ci/verify-gh-attestations.bash dist/nautilus_trader-*.whl

      - name: Publish wheels to Cloudflare R2
        uses: ./.github/actions/publish-wheels
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_URL: ${{ secrets.CLOUDFLARE_R2_URL }}

      - name: Fetch and delete artifacts for current run
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          bash ./scripts/ci/publish-wheels-delete-artifacts.sh

  cargo-deny:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: ./.github/actions/cargo-tool-install
        with:
          tool-name: cargo-deny

      - name: Run cargo-deny (advisories, licenses, sources, bans)
        run: |
          cargo deny --all-features check advisories licenses sources bans
          cargo deny --manifest-path crates/adapters/lighter/fuzz/pornin/Cargo.toml \
            --config .cargo/deny-fuzz.toml --locked --all-features check \
            advisories licenses sources bans

  cargo-vet:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'block' }}
          allowed-endpoints: >-
            ${{ vars.COMMON_ALLOWED_ENDPOINTS }}
            ${{ vars.CI_ALLOWED_ENDPOINTS }}

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-vet
        uses: ./.github/actions/cargo-tool-install
        with:
          tool-name: cargo-vet

      - name: Run cargo-vet
        run: |
          cargo vet --locked
          cargo vet --locked --manifest-path crates/adapters/lighter/fuzz/pornin/Cargo.toml \
            --store-path .supply-chain

  release-cargo-publish-preflight:
    name: release cargo publish preflight
    runs-on: ubuntu-latest
    needs:
      - cargo-deny
      - cargo-vet
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
