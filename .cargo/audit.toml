# cargo-audit configuration
# https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example
#
# Mirrors deny.toml [advisories] ignore list, plus advisories that cargo-audit
# surfaces but cargo-deny does not match against the resolved feature graph:
#   - RUSTSEC-2024-0388 (derivative, unmaintained via alloy-primitives -> ruint -> ark-ff)
#   - RUSTSEC-2026-0235 (inactive rust_decimal optional dependency retained in Cargo.lock)
#
# With the current Cargo.lock, chrono 0.4.45 and chrono-tz 0.10.4 (IANA 2025b)
# remain transitive via Arrow/DataFusion; object_store is an additional chrono path.
# Rust core time zones use jiff 0.2.35 with bundled IANA 2026c. Future unmaintained
# advisories for chrono or chrono-tz require documented ignore entries here and in
# deny.toml pending upstream migration.

[advisories]
ignore = [
  # paste unmaintained, transitive via alloy
  "RUSTSEC-2024-0436",
  # derivative unmaintained, transitive via alloy-primitives -> ruint -> ark-ff
  "RUSTSEC-2024-0388",
  # rustls-pemfile unmaintained, transitive via nautilus-network
  "RUSTSEC-2025-0134",
  # unic-* unmaintained, transitive via pyo3-stub-gen -> rustpython-parser (dev tool only)
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0090",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
  # bincode unmaintained, transitive via madsim and hypersync-client
  "RUSTSEC-2025-0141",
  # capnp unsound APIs, transitive via hypersync-client, awaiting upstream fix
  "RUSTSEC-2025-0143",
  # proc-macro-error2 unmaintained, transitive via alloy and tabled_derive
  "RUSTSEC-2026-0173",
  # quick-xml DoS, transitive via object_store 0.13.2; no object_store release with quick-xml >= 0.41.0
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  # rkyv validation bug in an inactive rust_decimal optional dependency retained in Cargo.lock
  "RUSTSEC-2026-0235",
]
